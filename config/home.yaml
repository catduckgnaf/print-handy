# More than one printer (#257 Stage 2): a config file may declare a roster
# instead of the single [printer] shape below — `printers:` here, [[printers]]
# in TOML — one entry per printer with its own connection keys and chat_id.
# The list is file-only; one entry value can be overridden with
# PRINT_HANDY__PRINTERS__<ID>__<KEY>. See docs/SETTINGS.md, "Printers list".
printer:
  model: flashforge.ad5x
  # Also pop up the pause reason as a Klipper prompt (Guppy Screen and the like).
  pause_prompt: false
nozzle_temp_offsets:
  brass: 0.0
  hardened_steel: 5.0
  stainless_steel: 5.0
  ruby: 0.0
  tungsten_carbide: 0.0
  diamond: 0.0
material_temps:
  PLA: {nozzle: 210, bed: 60}
  PETG: {nozzle: 240, bed: 85}
  ABS: {nozzle: 245, bed: 100}
  ASA: {nozzle: 260, bed: 105}
  TPU: {nozzle: 230, bed: 50}
  PA: {nozzle: 260, bed: 90}
  PC: {nozzle: 275, bed: 110}
# Slicing tuning per material family; a key set in your own config wins. Ships the PLA
# recipe from the 2026-11-02 AD5X comparison. Set a key to null to keep the template value.
material_tuning:
  PLA: {flow_ratio: 0.98, max_volumetric_speed: 12.0, min_layer_time: 8.0, outer_wall_speed_max: 60.0}
layout:
  max_merged_hours: 12
# Where a ZMod printer's color-change purge goes (docs/SETTINGS.md, "Purge and ZMod plugins").
# auto reads the printer's use_trash_on_print: 1 purges into the chute (no prime tower), 0 needs
# the tower. Put overrides in your own settings file so updates never overwrite them.
purge:
  mode: auto
  prime_tower: auto
  # flush_multiplier: 0.2   (optional; unset leaves the profile's flush volumes unchanged)
zmod:
  plugins: auto
orca:
  command:
  - flatpak
  - run
  - com.orcaslicer.OrcaSlicer
slicer:
  # Optional user-installed Flash Studio executable; empty keeps the normal Orca/Bambu behavior.
  flash_studio_path: ''
# Stock Flashforge LAN. Empty host means the printer stays offline. The serial and
# check code are never written here; they stay in AD5X_SERIAL and AD5X_CHECK_CODE.
flashforge_stock:
  host: ''
bambu:
  command:
  - flatpak
  - run
  - --unshare=network
  - --command=bambu-studio
  - com.bambulab.BambuStudio
  # Read-only LAN telemetry (#187): the printer's LAN address and serial number.
  # Both empty = no LAN connection (offline behaviour). The access code is a secret:
  # it lives only in the environment variable lan_access_code_env names, never here.
  lan_host: ''
  lan_serial: ''
  lan_access_code_env: BAMBU_LAN_PASSWORD
  # LAN print start: seconds to poll the printer for it to report the submitted file before
  # the start is left as uncertain (#271). An A1 can take over a minute to unpack a large package.
  start_confirm_s: 90
paths:
  # State, logs and the .env. The key name is historical; Hermes is not required. A native install
  # that still has data in the old default (~/.hermes/profiles/3dprinting) keeps using it until
  # you set this key or move the folder.
  state_home: ~/.local/share/print-handy
  archive: ~/3d-prints
  records_vault: ~/Documents/3D Printing Records
  cache: ~/.cache/print-handy
  ffmpeg: ffmpeg
  piper: piper
  piper_model: ''
services:
  moonraker_url: ''
  moonraker_ws_url: ''
  # Which camera still images come from (#294): auto follows the printer
  # vendor's rule; or pin moonraker, bambu, go2rtc, or none.
  camera_source: auto
  camera_snapshot_url: ''
  spoolman_url: ''
  vision_chat_url: ''
  stock_api_port: 8898
discord:
  chat_id: ''
  approval_user_id: ''
  upload_max_bytes: 9500000
  timezone: America/New_York
  bot_name: Print Handy
  question_timeout_s: 1800
  safety_confirm_timeout_s: 600
  upload_wait_s: 3600
  cold_pull_outcome_s: 1800
  token_env: DISCORD_BOT_TOKEN
  allowed_user_ids: ''
telegram:
  # Standalone bot only, when [bot] platform is telegram (#164). The token itself
  # never goes in a file here; token_env names the environment variable holding it.
  token_env: TELEGRAM_BOT_TOKEN
  # Chat (group) ID the bot posts to. Telegram group and channel IDs are negative.
  chat_id: ''
  # Telegram user IDs allowed to use the bot, separated by commas or spaces.
  # approval_user_id is always allowed. Empty with no approval_user_id refuses everyone.
  allowed_user_ids: ''
  approval_user_id: ''
  # Largest file the bot uploads: the Telegram Bot API cloud limit.
  upload_max_bytes: 50000000
matrix:
  # Standalone bot only, when [bot] platform is matrix (#164). The access token
  # itself never goes in a file here; access_token_env names the environment
  # variable holding it. The room must be unencrypted: encrypted rooms are
  # not supported.
  homeserver_url: ''
  access_token_env: MATRIX_ACCESS_TOKEN
  # Room ID of the print room (starts with '!'), from the room's settings.
  room_id: ''
  # Matrix user IDs allowed to use the bot, full @user:server form, separated
  # by commas or spaces. approval_user_id is always allowed. Empty with no
  # approval_user_id refuses everyone.
  allowed_user_ids: ''
  approval_user_id: ''
  # The bot's own Matrix user ID (@user:server). Empty: asked from the
  # homeserver (whoami) at startup.
  bot_user_id: ''
  # Largest file the bot uploads; the adapter lowers it to the homeserver's
  # media limit when the server reports a smaller one.
  upload_max_bytes: 50000000
bot:
  # standalone: python3 -m print_handy.bot talks to Discord directly (the
  # only mode; the Hermes install and runtime mode were removed).
  mode: standalone
  platform: discord
  health_port: 0
  health_stale_s: 120
  sync_commands: true
llm:
  chat_url: ''
  model: ''
  api_key_env: LLM_API_KEY
  timeout_s: 20
agent:
  # Agent endpoint for unmatched Web UI chat text, ahead of the [llm] call.
  # Replies cannot run commands.
  chat_url: ''
  model: ''
  api_key_env: AGENT_API_KEY
  timeout_s: 120
ai:
  # Who may use the AI edit lane (#902): chat user IDs, separated by commas
  # or spaces (a list also works). Empty keeps it open to
  # everyone the gateway already authorizes. edit_requests_per_hour is per
  # user over a rolling hour; 0 turns the limit off.
  allowed_users: ''
  edit_requests_per_hour: 20
  # Optional AI tiers (#818). Nothing ships filled in: leave a tier empty and
  # it keeps the settings it already used (small: services.vision_chat_url and
  # the vision models; chat: llm; heavy: design, which inherits llm).
  # A tier is a table with chat_url, model, fallback_model, fallback_url,
  # api_key_env, fallback_api_key_env and timeout_s. small = camera
  # and image check, label reading. chat = questions the
  # scripted handlers cannot answer. heavy = model-file editing and repair
  # (route only for now). A call that fails or times out is retried once on
  # fallback_model (on fallback_url when set, else the same endpoint).
  # Example:
  #   small:
  #     chat_url: http://127.0.0.1:11434/v1/chat/completions
  #     model: a-small-model
  #     fallback_model: another-model
  small: {}
  chat: {}
  heavy: {}
natural_language:
  # The deterministic plain-language layer (#1524): see docs/STANDALONE.md,
  # 'Plain words first'. shadow_mode logs disagreements locally and lets
  # the previous behavior answer; unmatched_log_enabled keeps a sanitized
  # local-only log of unmatched phrases; ai_rate_limit_per_hour caps the
  # conversational AI lane per user; ai_disabled_channel_ids switches
  # that lane off per channel.
  shadow_mode: false
  unmatched_log_enabled: false
  ai_rate_limit_per_hour: 20
  ai_disabled_channel_ids: []
design:
  # AI design with OpenSCAD (#388): /print-design (or /design) creates a
  # new printable part from a description. There is deliberately no
  # enabled line here: unset means AUTO — design turns on whenever a
  # design/LLM endpoint is configured. Set enabled: false to
  # force it off, or enabled: true to force it on. Empty
  # chat_url/model/api_key_env inherit the [llm] values, so a
  # single-endpoint setup only sets design.model (a stronger model
  # for design, e.g. sol at medium while chat stays luna at medium).
  # The endpoint fields are the whole story: design resolves only this
  # endpoint (inheriting [llm]); there is no fallback lane.
  chat_url: ''
  model: ''
  api_key_env: ''
  timeout_s: 180
  repair_attempts: 3
listener:
  tick_s: 600
  ifs_presence_poll_s: 15
  spool_nag_s: 600
  start_claim_ttl_s: 1800
spool:
  # Ask for the brand/vendor during the conversational new-spool
  # walkthrough (#512). On by default (#1718). Set false to skip the
  # brand question; the spool is then created without one.
  prompt_brand: true
cost:
  # Print cost calculator (#1625): workspace defaults for the one cost
  # engine every surface uses (chat, the Web UI calculator page, the
  # completion record, Data and Pasta Wrapped). Cost is information
  # only: it never blocks, delays or refuses a print. Per-printer
  # profiles live in the file-only cost_printers table below; filament
  # prices come from Spoolman first (see docs/COST.md).
  currency_code: USD
  electricity_rate_per_kwh: 0.19
  # Labor rate per hour. The hobby preset is an explicit 0: the labor
  # line still shows, priced at zero.
  labor_rate_per_hour: 20.0
  failure_rate_fdm: 0.05
  failure_rate_resin: 0.10
  # Selling price math, labeled in words everywhere it shows: margin
  # divides cost by (1 - margin); markup multiplies by (1 + markup).
  pricing_mode: margin
  default_margin: 0.40
  tax_rate: 0.0
  # add_on_top, included or none.
  tax_mode: add_on_top
  marketplace_fee_rate: 0.0
  overhead_percent: 0.0
  flat_fee_per_job: 0.0
  # Fallback filament price when neither Spoolman nor the slicer
  # embedded a price for a line.
  default_filament_cost_per_kg: 22.0
  # hobby leads every answer and Wrapped with what a print cost out of
  # pocket (filament, power, consumables); seller leads with the full
  # cost a quote must recover (labor and machine wear included) and
  # shows the selling price tiers. Both figures are always recorded.
  cost_mode: hobby
  # Resin consumables per print: IPA lost per wash, cleanup and PPE.
  resin_ipa_per_print: 0.23
  resin_ppe_per_print: 0.12
# Per-printer cost profiles (#1625), file only: a table keyed by roster
# id or printer name. Each entry may set technology (fdm or resin),
# purchase_price, upfront_cost, salvage_value, lifetime_hours,
# maintenance_per_hour, watts, watts_basis (manufacturer, measured or
# estimate), watts_by_material (a table of material to watts), idle
# watts, and for resin: wash_cure_watts, wash_cure_minutes,
# screen_price, screen_life_hours, film_price and film_life_prints.
# A printer with no entry uses the generic profile. Empty by default.
cost_printers: {}
vision:
  # Vision endpoint camera checks: off by default. Camera checks run on
  # this machine with the local failure detector below instead. While
  # false, no frame or photo is sent to a vision model endpoint
  # (PRINT_VISION_URL, services.vision_chat_url, ai.small): the camera
  # watchdog, idle plate checks, label reads and purchase reads treat the
  # endpoint as not configured. The local detector and plate reference
  # below keep their own switches. Set true to use the endpoint again.
  ai_enabled: false
  model: gemini-latest
  # The one-line roast on the completion, failure and cancel posts. On by
  # default, on every platform, Telegram included. Roasts come from the
  # local roast corpus and need no model or endpoint. Set false to turn
  # roasts off; camera checks are not affected.
  roast_enabled: true
  # Custom roast bank (#1002 Phase 4): empty (the default) means the
  # shipped roast corpus alone. Set it to the path of a JSON file of
  # your own roast lines and the valid entries are drawn alongside the
  # shipped lines; entries pass the same validation as the shipped
  # corpus, and a file that cannot be read is ignored with the problem
  # named in the log. See "Adding roast lines" in CONTRIBUTING.md.
  roast_custom_bank: ''
  # Local failure detector (#455): on by default. The camera watchdog
  # judges frames with the built-in ONNX detector on this machine; a
  # vision endpoint is used first only while ai_enabled is true. The
  # pinned model (about 202 MB) downloads once into a models folder under
  # the state folder, SHA-256 verified; nothing leaves the machine. Set
  # false to turn it off.
  local_detector_enabled: true
  # Which route judges the camera watchdog's frames (#455): auto (the
  # local detector, or the vision endpoint first while ai_enabled is
  # true: PRINT_VISION_URL, then the chat endpoint), endpoint
  # (endpoint routes only; the local detector is never consulted for the
  # watch) or local (the local detector only, even when an endpoint is
  # configured; counts as enabling the detector for the watch). Label
  # reads and roasts never follow this setting.
  watch_source: auto
  # Path to the local detector's ONNX model file. Empty uses the default
  # location and the pinned model; set it to a file you placed yourself
  # to run fully offline.
  local_model_path: ''
  # Local empty-plate reference (#455): off by default. When on, the
  # idle checks (auto light-off, next-plate offer) can judge the plate
  # against a reference photo of your empty plate, captured once with
  # /print-plate-calibrate capture in chat — entirely local, no endpoint
  # needed. A reference older than 30 days stops being trusted; capture
  # again after moving the camera or the plate.
  local_empty_enabled: false
  # Auto light-off (#516): 0 = off (the default). When set (30 is the
  # suggested value), the Moonraker listener turns the printer's light
  # on at print start and, after a print ends, off again once the camera
  # has seen an empty plate for that many minutes. Needs a vision
  # endpoint, like the camera watchdog.
  auto_light_off_minutes: 0
  # The Moonraker light object to switch, e.g. "led chamber_led",
  # "neopixel sb_leds" or "output_pin caselight". Empty auto-discovers:
  # the listener uses the printer's light object only when there is
  # exactly one, and stays off (and logs the candidates) otherwise.
  light_object: ''
visual_watch:
  # Camera watchdog sensitivity, 1 (quietest) to 5 (most alerts). 3 is the original behavior.
  # Periodic camera checks run every 1800, 1200, 900, 600 or 450 seconds for levels 1 to 5;
  # a stall alerts after 8, 5, 3, 3 or 2 unchanged layers. A vision "ok" cancels a stall alert
  # (Moonraker: every level; Bambu monitor: levels 1-2). Spaghetti, detached, empty-bed, uncertain and failed checks alert
  # at every level. The full table is in docs/PROJECT-REFERENCE.md (Camera stall sensitivity).
  sensitivity: 3
  enabled: true
  # Early-layer mode (#913): a risky print (a slicer finding, a "print anyway" override or
  # an operator supports decision) is checked on every layer change for its first
  # early_layers layers, and at least every early_interval_s seconds until then.
  # Normal prints keep the sensitivity schedule above.
  early_layers: 10
  early_interval_s: 120
  # auto_pause_early PAUSES THE PRINTER. When true, two suspicious verdicts in a row
  # (spaghetti, detached or air) inside the early-layer window send PAUSE through the
  # alert pause path. It never cancels; the alert keeps its stop and resume buttons.
  # Off by default: turn it on yourself.
  auto_pause_early: false
timelapse:
  # Mode (#246/#295): rendered = the printer renders it (moonraker-timelapse),
  # container = Print Handy captures and encodes it in-container, off = none.
  # Empty derives: rendered when a Moonraker URL is configured, else container
  # when capture_enabled is true, else off.
  mode: ''
  archive_host: ''
  archive_dir: ''
  ssh_key: ''
  render_wait_s: 900
  render_poll_s: 10
  max_bytes: 209715200
  local_retention_days: 1
  plan_clip_retention_days: 14
  # ffmpeg encoder for the timelapse sizing shrink (#314): cpu (libx264),
  # vaapi, qsv or nvenc. Hardware choices need the GPU passed through (see
  # docs/DOCKER.md); a failed hardware encode falls back to cpu.
  encoder: cpu
  # Vertical short (#317): also post a 9:16 version of each finished
  # timelapse, for Shorts/Reels/TikTok-style sharing. Off by default.
  vertical_short: false
  # pad = blurred background fill (default); crop = centre crop.
  vertical_short_mode: pad
  vertical_short_overlay: true
  # Data tab and Pasta Wrapped (#956): read-only statistics over the
  # print records plus the once-a-year Wrapped recap in the Web UI. On by
  # default; while off, each page is not in the navigation and its routes
  # refuse by name. An install that set wrapped_enabled: false before the
  # split keeps it off — the new default does not override an explicit
  # value. The Data tab has its own switch, data_enabled: while it is
  # unset (as here) it follows wrapped_enabled; set it to pin the Data
  # tab independently.
  wrapped_enabled: true
  # Wrapped video (#956): the on-demand local video compile, with the
  # local commentary (no AI model). The pre-rename spelling
  # wrapped_ai_video is still accepted as an alias (#1157).
  # On by default (#1718), and it needs wrapped_enabled above on.
  wrapped_video: true
  # Wrapped narration (#981): piper (the default, #1718: the local Piper
  # binary, paths.piper + paths.piper_model, used when available) or
  # none (no narration). No AI model and no cloud service: nothing is
  # sent anywhere.
  wrapped_tts_engine: piper
  # Wrapped music file (#981): an audio file you supply, used as the
  # video music bed instead of the bundled track. Empty (the default)
  # keeps the bundled track.
  wrapped_music_file: ''
  # In-container timelapse capture (#246): off by default; existing behaviour
  # (printer-rendered timelapses only) is unchanged while this is false.
  # Turning it on starts the bundled go2rtc in the full Docker image, which
  # normalises the camera source on loopback for the capture stage.
  capture_enabled: false
  # Optional explicit camera source for capture (an MJPEG/RTSP URL or a
  # go2rtc ffmpeg: source). Empty derives the source from
  # services.camera_snapshot_url / the Moonraker webcam, as the camera
  # watchdog does.
  capture_source_url: ''
  # Stage 2 frame capture: what makes the listener take a frame.
  # interval = every capture_interval_s seconds (default; printer-agnostic);
  # layer = on Moonraker layer changes (moonraker-timelapse semantics);
  # both = either (an interval floor plus layer events).
  capture_trigger: interval
  capture_interval_s: 5.0
  # Per-job storage caps for captured frames; 0 disables that cap. Capture
  # stops at a cap and the frames already taken are kept for the encode.
  # Playback length (#906): fps is chosen from the frame count and target_length_s,
  # clamped to min_fps..max_fps; beyond the clamp frames are decimated (too long) or
  # held (shorter than min_length_s). hold_last_frame_s keeps the final frame on screen.
  target_length_s: 20
  min_fps: 10
  max_fps: 60
  min_length_s: 5
  hold_last_frame_s: 1
  capture_max_frames: 3600
  capture_max_bytes: 536870912
  # Encoder preference for the Stage 3 encode (auto | vaapi | nvenc | qsv |
  # cpu). Capture itself never encodes; auto probes GPU encoders first.
  capture_encoder: cpu
logging:
  level: INFO
  format: text
  file: ''
  retention_days: 14
  # Per-subsystem verbosity (#390): logger name -> level, e.g.
  # levels: { "print_handy.core.orca_adapter": "DEBUG" }
  levels: {}
webui:
  # Web UI (#286): on by default. Port 0 means no port has been chosen
  # yet, and nothing listens until one is. The access token itself never
  # goes in a file here; access_token_env names the environment variable
  # holding it.
  enabled: true
  host: 127.0.0.1
  port: 0
  access_token_env: WEBUI_ACCESS_TOKEN
  # false turns the access token off entirely, even on a LAN bind: anyone who
  # can reach the port gets the Web UI. Only for a network you trust.
  require_auth: true
  # Printer control routes (#708); off by default (403, nothing sent). See docs/WEBUI.md.
  controls_enabled: false
  # When true, marks the Web UI session cookie Secure so browsers only transmit
  # it over HTTPS. Keep false for plain-HTTP LAN access so browsers accept the
  # cookie; set true when exposing the Web UI through an HTTPS reverse proxy.
  cookie_secure: false
  # Web chat's model lane remains configurable; see docs/SETTINGS.md.
  chat_llm_enabled: false
  # The Web UI chat page switch: off shows a disabled page and web chat
  # processes nothing at all.
  chat_enabled: true
live_stream:
  # Live camera viewing in Discord (#311): off by default. The bot cannot
  # send video itself; /print-live starts a viewing session and points at
  # the Discord Activity launched in voice_channel_id. The Discord client
  # secret and the Activity session secret are environment secrets, never
  # settings here.
  enabled: false
  voice_channel_id: ''
  auto_start_on_print: false
  max_height: 720
  fps: 15
  max_bitrate_kbps: 2500
  encoder: auto
  empty_timeout_s: 300
  activity_origin: ''
  port: 0
external_intake:
  # External sliced-job intake (#1525): an opt-in watched folder for jobs
  # sliced outside Print Handy. Off by default, and while directory is
  # empty nothing is scanned. The folder named here is the only one the
  # intake ever looks in. A file appearing there becomes a draft job card
  # on the Web UI's External intake page — it never prints, never sends a
  # printer command and never charges a spool. Recording a print takes
  # the operator's explicit Mark as printed confirmation on that page,
  # charged exactly once through the existing accounting ledger.
  enabled: false
  directory: ''
  # Largest single file the intake accepts, in bytes (512 MiB default).
  max_bytes: 536870912
notify:
  # Print events out of chat (#622): MQTT and ntfy, either or both, off by
  # default. A failed publish never blocks chat or a print. Neither
  # channel's credential is a setting: the MQTT password is MQTT_PASSWORD
  # and the ntfy access token is NTFY_ACCESS_TOKEN, both environment only.
  mqtt_enabled: false
  mqtt_host: ''
  mqtt_port: 1883
  mqtt_topic: print-handy
  mqtt_username: ''
  # Each printer's last roast as a retained MQTT sensor for Home Assistant
  # (#1672), with discovery. On by default; rides mqtt_enabled above and
  # vision.roast_enabled. Set false to keep the event topics only.
  mqtt_roast: true
  ntfy_enabled: false
  # The ntfy server (https://ntfy.sh or a self-hosted one); the topic URL
  # may name the topic itself, or set ntfy_topic and it is appended.
  ntfy_url: ''
  ntfy_topic: ''
firmware:
  # Chat alerts when a ZMod update is available (one alert per release,
  # checked once a day, never while printing). The alert's Update button
  # asks once more and applies only through the confirmed path; nothing
  # updates without that press. false turns the alerts off.
  update_alerts: true
  # The least stable prerelease track to hear about: stable (finals
  # only), rc (finals and release candidates), beta (adds betas) or
  # alpha (adds every other prerelease a firmware publishes). Only
  # firmware that publishes prereleases is affected, and a subscribed
  # prerelease is still installed only through the confirmed path.
  update_channel: stable
  # Hours between checks for each printer, 1 to 168.
  update_check_hours: 24
  # Firmware feed lines announced in chat (ids from docs/firmware-feed.toml).
  # Forge-X follows its feed channel: the 1.4.2 beta until it ships stable.
  # Every other firmware stays on the Web UI's Firmware page only.
  notice_firmwares: [zmod, opencreator, forge-x]
maintenance:
  quick_hours: 25
  full_hours: 75
  full_days: 30
  # /print-bed-down (prepare to clean): mm the bed and nozzle move apart, 1 to 50.
  bed_separate_mm: 20
public_text:
  # Operator machine names the log sanitizer must strip from exports
  # (#1020): your own hosts' names, as they appear in log lines. They are
  # names only — the export sanitizer replaces each with a pseudonym.
  # Example: denylist = ["myserver", "nas-box"]
  denylist: []
