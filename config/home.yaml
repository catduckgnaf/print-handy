# More than one printer (#257 Stage 2): a config file may declare a roster
# instead of the single [printer] shape below — `printers:` here, [[printers]]
# in TOML — one entry per printer with its own connection keys and chat_id.
# The list is file-only; one entry value can be overridden with
# PRINT_HANDY__PRINTERS__<ID>__<KEY>. See docs/SETTINGS.md, "Printers list".
printer:
  model: flashforge.ad5x
nozzle_temp_offsets:
  brass: 0.0
  hardened_steel: 5.0
  stainless_steel: 5.0
  ruby: 0.0
  tungsten_carbide: 0.0
  diamond: 0.0
material_temps:
  PLA: {nozzle: 210, bed: 60}
  PETG: {nozzle: 240, bed: 85}
  ABS: {nozzle: 245, bed: 100}
  ASA: {nozzle: 260, bed: 105}
  TPU: {nozzle: 230, bed: 50}
  PA: {nozzle: 260, bed: 90}
  PC: {nozzle: 275, bed: 110}
# Slicing tuning per material family; a key set in your own config wins. Ships the PLA
# recipe from the 2026-11-02 AD5X comparison. Set a key to null to keep the template value.
material_tuning:
  PLA: {flow_ratio: 0.98, max_volumetric_speed: 12.0, min_layer_time: 8.0, outer_wall_speed_max: 60.0}
layout:
  max_merged_hours: 12
# Where a ZMod printer's color-change purge goes (docs/SETTINGS.md, "Purge and ZMod plugins").
# auto reads the printer's use_trash_on_print: 1 purges into the chute (no prime tower), 0 needs
# the tower. Put overrides in your own settings file so updates never overwrite them.
purge:
  mode: auto
  prime_tower: auto
  # flush_multiplier: 0.2   (optional; unset leaves the profile's flush volumes unchanged)
zmod:
  plugins: auto
orca:
  command:
  - flatpak
  - run
  - com.orcaslicer.OrcaSlicer
slicer:
  # Optional user-installed Flash Studio executable; empty keeps the normal Orca/Bambu behavior.
  flash_studio_path: ''
# Stock Flashforge LAN. Empty host means the printer stays offline. The serial and
# check code are never written here; they stay in AD5X_SERIAL and AD5X_CHECK_CODE.
flashforge_stock:
  host: ''
bambu:
  command:
  - flatpak
  - run
  - --unshare=network
  - --command=bambu-studio
  - com.bambulab.BambuStudio
  # Read-only LAN telemetry (#187): the printer's LAN address and serial number.
  # Both empty = no LAN connection (offline behaviour). The access code is a secret:
  # it lives only in the environment variable lan_access_code_env names, never here.
  lan_host: ''
  lan_serial: ''
  lan_access_code_env: BAMBU_LAN_PASSWORD
  # LAN print start: seconds to poll the printer for it to report the submitted file before
  # the start is left as uncertain (#271). An A1 can take over a minute to unpack a large package.
  start_confirm_s: 90
paths:
  hermes_home: ~/.hermes/profiles/3dprinting
  archive: ~/3d-prints
  records_vault: ~/Documents/3D Printing Records
  cache: ~/.hermes/cache
  hermes_bin: ~/.local/bin/hermes
  ffmpeg: ffmpeg
  piper: piper
  piper_model: ''
  hermes_agent: ~/.hermes/hermes-agent
  hermes_restart_helper: ~/.hermes/skills/autonomous-ai-agents/hermes-safe-restart/scripts/restart_hermes.py
services:
  moonraker_url: ''
  moonraker_ws_url: ''
  # Which camera still images come from (#294): auto follows the printer
  # vendor's rule; or pin moonraker, bambu, go2rtc, or none.
  camera_source: auto
  camera_snapshot_url: ''
  spoolman_url: ''
  vision_chat_url: ''
  stock_api_port: 8898
discord:
  chat_id: ''
  approval_user_id: ''
  upload_max_bytes: 9500000
  post_print_quiet_s: 7200
  daily_reset_hour: 4
  timezone: America/New_York
  bot_name: Print Handy
  question_timeout_s: 1800
  safety_confirm_timeout_s: 600
  upload_wait_s: 3600
  cold_pull_outcome_s: 1800
  token_env: DISCORD_BOT_TOKEN
  allowed_user_ids: ''
telegram:
  # Standalone bot only, when [bot] platform is telegram (#164). The token itself
  # never goes in a file here; token_env names the environment variable holding it.
  token_env: TELEGRAM_BOT_TOKEN
  # Chat (group) ID the bot posts to. Telegram group and channel IDs are negative.
  chat_id: ''
  # Telegram user IDs allowed to use the bot, separated by commas or spaces.
  # approval_user_id is always allowed. Empty with no approval_user_id refuses everyone.
  allowed_user_ids: ''
  approval_user_id: ''
  # Largest file the bot uploads: the Telegram Bot API cloud limit.
  upload_max_bytes: 50000000
matrix:
  # Standalone bot only, when [bot] platform is matrix (#164). The access token
  # itself never goes in a file here; access_token_env names the environment
  # variable holding it. The room must be unencrypted: encrypted rooms are
  # not supported.
  homeserver_url: ''
  access_token_env: MATRIX_ACCESS_TOKEN
  # Room ID of the print room (starts with '!'), from the room's settings.
  room_id: ''
  # Matrix user IDs allowed to use the bot, full @user:server form, separated
  # by commas or spaces. approval_user_id is always allowed. Empty with no
  # approval_user_id refuses everyone.
  allowed_user_ids: ''
  approval_user_id: ''
  # The bot's own Matrix user ID (@user:server). Empty: asked from the
  # homeserver (whoami) at startup.
  bot_user_id: ''
  # Largest file the bot uploads; the adapter lowers it to the homeserver's
  # media limit when the server reports a smaller one.
  upload_max_bytes: 50000000
bot:
  # standalone: python3 -m print_handy.bot talks to Discord directly (the default).
  # hermes: the Hermes gateway runs the print-feedback plugin instead.
  # Use one mode per bot token.
  mode: standalone
  platform: discord
  health_port: 0
  health_stale_s: 120
  sync_commands: true
llm:
  chat_url: ''
  model: ''
  api_key_env: LLM_API_KEY
  timeout_s: 20
agent:
  # Stray-chat agent lane (#524 stage 3): an agent endpoint — any
  # OpenAI-compatible chat completions URL, e.g. a Hermes agent behind
  # its API — that answers Discord free text the handlers did not take,
  # ahead of the [llm] call above. Empty chat_url: no agent lane; stray
  # chat uses [llm] if configured, else the short not-understood reply.
  # The endpoint answers in its own voice; its replies are posted as-is
  # and can never run a command. model is optional: empty omits it from
  # the request, for endpoints that are not model-addressable.
  # discord.chat_llm_enabled=false turns this lane off too — no
  # stray-chat model call of any kind.
  chat_url: ''
  model: ''
  api_key_env: AGENT_API_KEY
  timeout_s: 120
ai:
  # Who may use the AI edit lane (#902): chat user IDs. Empty keeps it open to
  # everyone the gateway already authorizes. edit_requests_per_hour is per
  # user over a rolling hour; 0 turns the limit off.
  allowed_users: []
  edit_requests_per_hour: 20
  # Optional AI tiers (#818). Nothing ships filled in: leave a tier empty and
  # it keeps the settings it already used (small: services.vision_chat_url and
  # the vision models; chat: llm; heavy: design, which inherits llm).
  # A tier is a table with chat_url, model, fallback_model, fallback_url,
  # api_key_env, fallback_api_key_env and timeout_s. small = print-start
  # roast, camera and image check, label reading. chat = questions the
  # scripted handlers cannot answer. heavy = model-file editing and repair
  # (route only for now). A call that fails or times out is retried once on
  # fallback_model (on fallback_url when set, else the same endpoint).
  # Example:
  #   small:
  #     chat_url: http://127.0.0.1:11434/v1/chat/completions
  #     model: a-small-model
  #     fallback_model: another-model
  small: {}
  chat: {}
  heavy: {}
design:
  # AI design with OpenSCAD (#388): /print-design (or /design) creates a
  # new printable part from a description. There is deliberately no
  # enabled line here: unset means AUTO — design turns on whenever a
  # design/LLM endpoint is configured, like roasts. Set enabled: false to
  # force it off, or enabled: true to force it on. Empty
  # chat_url/model/api_key_env inherit the [llm] values, so a
  # single-endpoint setup only sets design.model (a stronger model
  # for design, e.g. sol at medium while chat stays luna at medium).
  # The endpoint fields win in every mode, Hermes included: the
  # profile's auxiliary.print_design block is only the fallback for a
  # Hermes install with no endpoint configured.
  chat_url: ''
  model: ''
  api_key_env: ''
  timeout_s: 180
  repair_attempts: 3
listener:
  tick_s: 600
  ifs_presence_poll_s: 15
  spool_nag_s: 600
  start_claim_ttl_s: 1800
spool:
  # Ask for the brand/vendor during the conversational new-spool
  # walkthrough (#512). Off by default: the walkthrough skips brand and
  # the spool is created without one. Set true if you track brands.
  prompt_brand: false
vision:
  model: gemini-latest
  roast_model: luna-latest
  # The one-line roast on the print-started post only. On by
  # default: it runs whenever an LLM/vision endpoint is available
  # (services.vision_chat_url plus CLIPROXY_API_KEY), on every platform,
  # Telegram included. Set false to turn roasts off; camera checks keep
  # using the same endpoint either way.
  roast_enabled: true
  # Local failure detector (#455): off by default. When on, the camera
  # watchdog can judge frames with the built-in ONNX detector on installs
  # with no vision endpoint route configured (PRINT_VISION_URL and
  # services.vision_chat_url keep precedence). The pinned model
  # (about 202 MB) downloads once into a models folder under the Hermes
  # home, SHA-256 verified; nothing leaves the machine.
  local_detector_enabled: false
  # Which route judges the camera watchdog's frames (#455): auto (the
  # default precedence — PRINT_VISION_URL, then the chat endpoint, then
  # the local detector when no endpoint route is configured), endpoint
  # (endpoint routes only; the local detector is never consulted for the
  # watch) or local (the local detector only, even when an endpoint is
  # configured; counts as enabling the detector for the watch). Label
  # reads and roasts never follow this setting.
  watch_source: auto
  # Path to the local detector's ONNX model file. Empty uses the default
  # location and the pinned model; set it to a file you placed yourself
  # to run fully offline.
  local_model_path: ''
  # Auto light-off (#516): 0 = off (the default). When set (30 is the
  # suggested value), the Moonraker listener turns the printer's light
  # on at print start and, after a print ends, off again once the camera
  # has seen an empty plate for that many minutes. Needs a vision
  # endpoint, like the camera watchdog.
  auto_light_off_minutes: 0
  # The Moonraker light object to switch, e.g. "led chamber_led",
  # "neopixel sb_leds" or "output_pin caselight". Empty auto-discovers:
  # the listener uses the printer's light object only when there is
  # exactly one, and stays off (and logs the candidates) otherwise.
  light_object: ''
visual_watch:
  # Camera watchdog sensitivity, 1 (quietest) to 5 (most alerts). 3 is the original behavior.
  # Periodic camera checks run every 1800, 1200, 900, 600 or 450 seconds for levels 1 to 5;
  # a stall alerts after 8, 5, 3, 3 or 2 unchanged layers. A vision "ok" cancels a stall alert
  # (Moonraker: every level; Bambu monitor: levels 1-2). Spaghetti, detached, empty-bed, uncertain and failed checks alert
  # at every level. The full table is in docs/PROJECT-REFERENCE.md (Camera stall sensitivity).
  sensitivity: 3
  enabled: true
  # Early-layer mode (#913): a risky print (a slicer finding, a "print anyway" override or
  # an operator supports decision) is checked on every layer change for its first
  # early_layers layers, and at least every early_interval_s seconds until then.
  # Normal prints keep the sensitivity schedule above.
  early_layers: 10
  early_interval_s: 120
  # auto_pause_early PAUSES THE PRINTER. When true, two suspicious verdicts in a row
  # (spaghetti, detached or air) inside the early-layer window send PAUSE through the
  # alert pause path. It never cancels; the alert keeps its stop and resume buttons.
  # Off by default: turn it on yourself.
  auto_pause_early: false
timelapse:
  # Mode (#246/#295): rendered = the printer renders it (moonraker-timelapse),
  # container = Print Handy captures and encodes it in-container, off = none.
  # Empty derives: rendered when a Moonraker URL is configured, else container
  # when capture_enabled is true, else off.
  mode: ''
  archive_host: ''
  archive_dir: ''
  ssh_key: ''
  render_wait_s: 900
  render_poll_s: 10
  max_bytes: 209715200
  local_retention_days: 1
  plan_clip_retention_days: 14
  # ffmpeg encoder for the timelapse sizing shrink (#314): cpu (libx264),
  # vaapi, qsv or nvenc. Hardware choices need the GPU passed through (see
  # docs/DOCKER.md); a failed hardware encode falls back to cpu.
  encoder: cpu
  # Vertical short (#317): also post a 9:16 version of each finished
  # timelapse, for Shorts/Reels/TikTok-style sharing. Off by default.
  vertical_short: false
  # pad = blurred background fill (default); crop = centre crop.
  vertical_short_mode: pad
  vertical_short_overlay: true
  # Data tab and Print Handy Wrapped (#956): read-only statistics over the
  # print records plus the once-a-year Wrapped recap in the Web UI. Off by
  # default; while off the pages are not in the navigation and their routes
  # refuse by name.
  wrapped_enabled: false
  # Wrapped video (#956): the on-demand local video compile, with the
  # local commentary (no AI model; the key keeps its original name).
  # Off by default, and it needs wrapped_enabled above on.
  wrapped_ai_video: false
  # Wrapped narration (#981): none (default, no narration) or piper (the
  # local Piper binary, paths.piper + paths.piper_model). No AI model and
  # no cloud service: nothing is sent anywhere.
  wrapped_tts_engine: none
  # Wrapped music file (#981): an audio file you supply, used as the
  # video music bed instead of the synthesized bed. Empty = synthesized.
  wrapped_music_file: ''
  # In-container timelapse capture (#246): off by default; existing behaviour
  # (printer-rendered timelapses only) is unchanged while this is false.
  # Turning it on starts the bundled go2rtc in the full Docker image, which
  # normalises the camera source on loopback for the capture stage.
  capture_enabled: false
  # Optional explicit camera source for capture (an MJPEG/RTSP URL or a
  # go2rtc ffmpeg: source). Empty derives the source from
  # services.camera_snapshot_url / the Moonraker webcam, as the camera
  # watchdog does.
  capture_source_url: ''
  # Stage 2 frame capture: what makes the listener take a frame.
  # interval = every capture_interval_s seconds (default; printer-agnostic);
  # layer = on Moonraker layer changes (moonraker-timelapse semantics);
  # both = either (an interval floor plus layer events).
  capture_trigger: interval
  capture_interval_s: 5.0
  # Per-job storage caps for captured frames; 0 disables that cap. Capture
  # stops at a cap and the frames already taken are kept for the encode.
  # Playback length (#906): fps is chosen from the frame count and target_length_s,
  # clamped to min_fps..max_fps; beyond the clamp frames are decimated (too long) or
  # held (shorter than min_length_s). hold_last_frame_s keeps the final frame on screen.
  target_length_s: 20
  min_fps: 10
  max_fps: 60
  min_length_s: 5
  hold_last_frame_s: 1
  capture_max_frames: 3600
  capture_max_bytes: 536870912
  # Encoder preference for the Stage 3 encode (auto | vaapi | nvenc | qsv |
  # cpu). Capture itself never encodes; the value is recorded now so the
  # encode stage needs no settings change.
  capture_encoder: auto
logging:
  level: INFO
  format: text
  file: ''
  retention_days: 14
  # Per-subsystem verbosity (#390): logger name -> level, e.g.
  # levels: { "print_handy.core.orca_adapter": "DEBUG" }
  levels: {}
webui:
  # Optional Web UI (#286): off by default; nothing listens while disabled.
  # Port 0 means no port has been chosen yet. The access token itself never
  # goes in a file here; access_token_env names the environment variable
  # holding it.
  enabled: false
  host: 127.0.0.1
  port: 0
  access_token_env: WEBUI_ACCESS_TOKEN
  # false turns the access token off entirely, even on a LAN bind: anyone who
  # can reach the port gets the Web UI. Only for a network you trust.
  require_auth: true
  # Printer control routes (#708); off by default (403, nothing sent). See docs/WEBUI.md.
  controls_enabled: false
  # When true, marks the Web UI session cookie Secure so browsers only transmit
  # it over HTTPS. Keep false for plain-HTTP LAN access so browsers accept the
  # cookie; set true when exposing the Web UI through an HTTPS reverse proxy.
  cookie_secure: false
live_stream:
  # Live camera viewing in Discord (#311): off by default. The bot cannot
  # send video itself; /print-live starts a viewing session and points at
  # the Discord Activity launched in voice_channel_id. The Discord client
  # secret and the Activity session secret are environment secrets, never
  # settings here.
  enabled: false
  voice_channel_id: ''
  auto_start_on_print: false
  max_height: 720
  fps: 15
  max_bitrate_kbps: 2500
  encoder: auto
  empty_timeout_s: 300
  activity_origin: ''
  port: 0
notify:
  # Print events out of chat (#622): MQTT and ntfy, either or both, off by
  # default. A failed publish never blocks chat or a print. Neither
  # channel's credential is a setting: the MQTT password is MQTT_PASSWORD
  # and the ntfy access token is NTFY_ACCESS_TOKEN, both environment only.
  mqtt_enabled: false
  mqtt_host: ''
  mqtt_port: 1883
  mqtt_topic: print-handy
  mqtt_username: ''
  ntfy_enabled: false
  # The ntfy server (https://ntfy.sh or a self-hosted one); the topic URL
  # may name the topic itself, or set ntfy_topic and it is appended.
  ntfy_url: ''
  ntfy_topic: ''
maintenance:
  quick_hours: 25
  full_hours: 75
  full_days: 30
  # /print-bed-down (prepare to clean): mm the bed and nozzle move apart, 1 to 50.
  bed_separate_mm: 20
public_text:
  # Operator machine names the log sanitizer must strip from exports
  # (#1020): your own hosts' names, as they appear in log lines. They are
  # names only — the export sanitizer replaces each with a pseudonym.
  # Example: denylist = ["myserver", "nas-box"]
  denylist: []
