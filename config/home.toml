# Print Handy settings: catduck's home setup. Tests run against this exact file.
#
# Change hardware values here, not in code. For anything private or machine specific
# (addresses, tokens, paths on the home box), create config/local.toml. It is gitignored
# and its values override this file key by key. PRINT_HANDY_CONFIG=/path/to/file.toml
# overrides with that file instead of config/local.toml.

[printer]
# Which printer this install drives, "brand.model": flashforge.ad5x, sovol.sv06 or klipper.generic.
# The model's own file under print_handy/printers/ supplies the bed, height, nozzle, slots, start and end
# macros, edge margins, prime tower and cold pull defaults. Override any of them in config/local.toml.
model = "flashforge.ad5x"

# Type-specific thermal and flow defaults are validated in data/nozzles.toml.
# Opt-in compensation offsets; every nozzle type defaults to 0 °C.
[nozzle_temp_offsets]
brass = 0.0
hardened_steel = 5.0
stainless_steel = 5.0
ruby = 0.0
tungsten_carbide = 0.0
diamond = 0.0

[layout]
# Merged plates longer than this are kept separate. The edge margins and merge gaps come from the printer model.
max_merged_hours = 12

[orca]
# The Orca template folder (machine.json, process.json, filament.json) comes from the printer model; set
# templates = "path" in config/local.toml to use another folder, relative to the repository root.
# How to start the Orca CLI. The home box and the CI slicer job both use the Flathub build.
command = ["flatpak", "run", "com.orcaslicer.OrcaSlicer"]

[slicer]
# Optional user-installed Flash Studio executable; empty keeps the normal Orca/Bambu behavior.
flash_studio_path = ""

[flashforge_stock]
# Stock Flashforge LAN. Empty host means the printer stays offline. The serial and
# check code are never written here; they stay in AD5X_SERIAL and AD5X_CHECK_CODE.
host = ""

[bambu]
# Fallback slicer when Orca fails. Network is cut so it never phones home.
command = ["flatpak", "run", "--unshare=network", "--command=bambu-studio", "com.bambulab.BambuStudio"]
# Read-only LAN telemetry (#187): printer LAN address + serial; both empty = no LAN connection.
# The access code is a secret and lives only in the environment variable lan_access_code_env names.
lan_host = ""
lan_serial = ""
lan_access_code_env = "BAMBU_LAN_PASSWORD"
# LAN print start: seconds to poll the printer for it to report the submitted file before the
# start is left as uncertain (#271). An A1 can take over a minute to unpack a large package.
start_confirm_s = 90

[paths]
# Hermes profile the bot runs in. State files live in <hermes_home>/state.
hermes_home = "~/.hermes/profiles/3dprinting"
archive = "~/3d-prints"
records_vault = "~/Documents/3D Printing Records"
cache = "~/.hermes/cache"
hermes_bin = "~/.local/bin/hermes"
ffmpeg = "ffmpeg"
# Hermes checkout. Added to sys.path only when hermes_state / hermes_cli must be imported.
hermes_agent = "~/.hermes/hermes-agent"
# Safe gateway restart helper run by bin/restart_gateway_after_print.sh (HERMES_RESTART_HELPER overrides).
hermes_restart_helper = "~/.hermes/skills/autonomous-ai-agents/hermes-safe-restart/scripts/restart_hermes.py"

[services]
# Addresses are machine specific: set them in config/local.toml. Empty means not configured.
moonraker_url = ""
# Derived from moonraker_url when empty.
moonraker_ws_url = ""
# Which camera still images come from (#294): auto follows the printer
# vendor's rule; or pin moonraker, bambu, go2rtc, or none.
camera_source = "auto"
camera_snapshot_url = ""
spoolman_url = ""
openviking_url = ""
vision_chat_url = ""
# Flashforge stock API port for IFS presence. Serial and check code stay in the profile .env.
stock_api_port = 8898

[discord]
# Channel and approver IDs go in config/local.toml.
chat_id = ""
approval_user_id = ""
upload_max_bytes = 9500000
post_print_quiet_s = 7200
daily_reset_hour = 4
timezone = "America/New_York"
# Name the bot uses for itself in the roast persona and the profile templates the installer renders.
bot_name = "Print Handy"
# How long a Discord question waits for a button press, in seconds.
question_timeout_s = 1800
# How long a safety confirmation (bed clear, destructive start) waits.
safety_confirm_timeout_s = 600
# How long an uploaded file stays valid before the start step expires.
upload_wait_s = 3600
# How long a cold-pull outcome prompt stays open.
cold_pull_outcome_s = 1800
# Standalone bot only: the environment variable holding the Discord bot token. The token itself never goes in a file here.
token_env = "DISCORD_BOT_TOKEN"
# Standalone bot only: Discord user IDs allowed to use the bot, separated by commas or spaces.
# approval_user_id is always allowed. Empty with no approval_user_id refuses everyone.
allowed_user_ids = ""

[telegram]
# Standalone bot only, when [bot] platform is telegram (#164). The token itself
# never goes in a file here; token_env names the environment variable holding it.
token_env = "TELEGRAM_BOT_TOKEN"
# Chat (group) ID the bot posts to. Telegram group and channel IDs are negative.
chat_id = ""
# Telegram user IDs allowed to use the bot, separated by commas or spaces.
# approval_user_id is always allowed. Empty with no approval_user_id refuses everyone.
allowed_user_ids = ""
approval_user_id = ""
# Largest file the bot uploads: the Telegram Bot API cloud limit.
upload_max_bytes = 50000000

[matrix]
# Standalone bot only, when [bot] platform is matrix (#164). The access token
# itself never goes in a file here; access_token_env names the environment
# variable holding it. The room must be unencrypted.
homeserver_url = ""
access_token_env = "MATRIX_ACCESS_TOKEN"
# Room ID of the print room (starts with "!"), from the room's settings.
room_id = ""
# Matrix user IDs allowed to use the bot, full @user:server form, separated
# by commas or spaces. approval_user_id is always allowed.
allowed_user_ids = ""
approval_user_id = ""
# The bot's own Matrix user ID (@user:server). Empty: asked from the
# homeserver (whoami) at startup.
bot_user_id = ""
# Largest file the bot uploads; lowered to the homeserver's media limit
# when the server reports a smaller one.
upload_max_bytes = 50000000

[bot]
# standalone: python3 -m print_handy.bot talks to Discord directly (the default). No Hermes, no LLM needed.
# hermes: the Hermes gateway runs the print-feedback plugin instead.
# Use one mode per bot token.
mode = "standalone"
# Standalone bot only: the chat platform ([bot] platform, #164). discord is the default;
# telegram (#164 stage 2) and matrix (stage 3) are implemented.
platform = "discord"
# Standalone bot: serve GET /healthz on this port. 0 turns the HTTP check off; the health file still works.
health_port = 0
# The health check fails when the bot's heartbeat is older than this, in seconds.
health_stale_s = 120
# Standalone bot: register the slash commands with Discord at startup.
sync_commands = true

[llm]
# Optional natural language for the standalone bot: any OpenAI-compatible chat completions URL.
# Empty: unmatched messages get the command list. The model never starts or changes a print itself.
chat_url = ""
model = ""
# Environment variable holding the API key for chat_url, if it needs one.
api_key_env = "LLM_API_KEY"
timeout_s = 20

[agent]
# Stray-chat agent lane (#524 stage 3): an agent endpoint — any
# OpenAI-compatible chat completions URL, e.g. a Hermes agent behind its
# API — that answers Discord free text the handlers did not take, ahead of
# the [llm] call above. Empty chat_url: no agent lane; stray chat uses
# [llm] if configured, else the short not-understood reply. The endpoint
# answers in its own voice; its replies are posted as-is and can never run
# a command. model is optional: empty omits it from the request, for
# endpoints that are not model-addressable. discord.chat_llm_enabled=false
# turns this lane off too — no stray-chat model call of any kind.
chat_url = ""
model = ""
# Environment variable holding the API key for chat_url, if it needs one.
api_key_env = "AGENT_API_KEY"
timeout_s = 120

[design]
# AI design with OpenSCAD (#388): /print-design creates a new printable part
# from a description. No enabled line on purpose: unset means AUTO — design
# turns on whenever a design/LLM endpoint is configured, like roasts. Set
# enabled = false to force it off, or enabled = true to force it on. Empty
# chat_url/model/api_key_env inherit the [llm] values. The endpoint fields
# win in every mode, Hermes included: the profile's auxiliary.print_design
# block is only the fallback for a Hermes install with no endpoint
# configured.
chat_url = ""
model = ""
api_key_env = ""
timeout_s = 180
repair_attempts = 3

[listener]
tick_s = 600
ifs_presence_poll_s = 15
spool_nag_s = 600
start_claim_ttl_s = 1800

[vision]
model = "gemini-latest"
# Model used for the one line roast on the print started post (vision_chat_url, key CLIPROXY_API_KEY).
roast_model = "luna-latest"
# The roast itself: on by default whenever an LLM/vision endpoint is available
# (vision_chat_url plus CLIPROXY_API_KEY), on every platform, Telegram included.
# Set false to turn roasts off; camera checks keep using the same endpoint.
roast_enabled = true
# Local failure detector (#455): off by default. When on, the camera
# watchdog can judge frames with the built-in ONNX detector on installs
# with no vision endpoint route configured (PRINT_VISION_URL and
# services.vision_chat_url keep precedence). The pinned model
# (about 202 MB) downloads once into a models folder under the Hermes
# home, SHA-256 verified; nothing leaves the machine.
local_detector_enabled = false
# Path to the local detector's ONNX model file. Empty uses the default
# location and the pinned model; set it to a file you placed yourself
# to run fully offline.
local_model_path = ""
# Auto light-off (#516): 0 = off (the default). When set (30 suggested), the
# Moonraker listener turns the printer's light on at print start and, after a
# print ends, off again once the camera has seen an empty plate for that many
# minutes. Needs a vision endpoint, like the camera watchdog.
auto_light_off_minutes = 0
# The Moonraker light object to switch, e.g. "led chamber_led",
# "neopixel sb_leds" or "output_pin caselight". Empty auto-discovers: the
# listener uses the printer's light object only when there is exactly one.
light_object = ""

[visual_watch]
# Camera stall alert sensitivity, 1 (quietest) to 5 (most alerts). 3 is the original behavior.
#   1: frame must barely move (mean diff < 1.5) for 8 layers; vision "ok"/"safe" cancels the alert
#   2: diff < 2.0 for 5 layers; vision "ok"/"safe" cancels the alert
#   3: diff < 3.0 for 3 layers; alerts even when vision says "ok"
#   4: diff < 4.0 for 3 layers; alerts even when vision says "ok"
#   5: diff < 5.0 for 2 layers; alerts even when vision says "ok"
# Periodic camera checks run every 1800, 1200, 900, 600 or 450 seconds for levels 1 to 5.
# The Moonraker (Klipper) watchdog never alerts on a stall when vision says "ok"/"safe", at any
# level; the per-level "ok" rule above applies to the Bambu launched-print monitor.
sensitivity = 3

[timelapse]
# Mode (#246/#295): rendered = the printer renders it (moonraker-timelapse),
# container = Print Handy captures and encodes it in-container, off = none.
# Empty derives: rendered when a Moonraker URL is configured, else container
# when capture_enabled is true, else off.
mode = ""
# Remote archive over ssh. Empty host disables the copy.
archive_host = ""
archive_dir = ""
ssh_key = ""
render_wait_s = 900
render_poll_s = 10
max_bytes = 209715200
local_retention_days = 1
# Clips held for a multi-plate plan that never finishes (abandoned) are dropped after this many days.
plan_clip_retention_days = 14
# ffmpeg encoder for the timelapse sizing shrink (#314): cpu (libx264),
# vaapi, qsv or nvenc. Hardware choices need the GPU passed through (see
# docs/DOCKER.md); a failed hardware encode falls back to cpu.
encoder = "cpu"
# Vertical short (#317): also post a 9:16 version of each finished timelapse. Off by default.
vertical_short = false
# pad = blurred background fill (default); crop = centre crop.
vertical_short_mode = "pad"
vertical_short_overlay = true
# In-container timelapse capture (#246): off by default; existing behaviour
# (printer-rendered timelapses only) is unchanged while this is false.
capture_enabled = false
# Optional explicit camera source for capture (an MJPEG/RTSP URL or a
# go2rtc ffmpeg: source). Empty derives the source from
# services.camera_snapshot_url / the Moonraker webcam.
capture_source_url = ""
# Stage 2 frame capture trigger: interval (default; every capture_interval_s
# seconds), layer (on Moonraker layer changes), or both.
capture_trigger = "interval"
capture_interval_s = 5.0
# Per-job storage caps for captured frames; 0 disables that cap.
capture_max_frames = 3600
capture_max_bytes = 536870912
# Encoder preference for the Stage 3 encode (auto | vaapi | nvenc | qsv |
# cpu). Capture itself never encodes.
capture_encoder = "auto"

[logging]
# Verbosity: DEBUG, INFO, WARNING or ERROR. DEBUG adds diagnostic detail; INFO is the normal level.
level = "INFO"
# text: one readable line per event. json: one JSON object per line, for log shippers.
format = "text"
# Also write a rotating log file here (5 MiB, 3 backups). Empty logs to stderr only (journald or docker logs).
file = ""
# Per-subsystem verbosity (#390): logger name -> level, e.g.
# levels = { "print_handy.core.orca_adapter" = "DEBUG" }
levels = {}

[webui]
# Optional Web UI (#286): off by default; nothing listens while disabled.
# Port 0 means no port has been chosen yet. The access token itself never
# goes in a file here; access_token_env names the environment variable
# holding it.
enabled = false
host = "127.0.0.1"
port = 0
access_token_env = "WEBUI_ACCESS_TOKEN"

[live_stream]
# Live camera viewing in Discord (#311): off by default. The bot cannot
# send video itself; /print-live starts a viewing session and points at
# the Discord Activity launched in voice_channel_id. The Discord client
# secret and the Activity session secret are environment secrets, never
# settings here.
enabled = false
voice_channel_id = ""
auto_start_on_print = false
max_height = 720
fps = 15
max_bitrate_kbps = 2500
encoder = "auto"
empty_timeout_s = 300
activity_origin = ""
port = 0

[notify]
# Print events out of chat (#622): MQTT and ntfy, either or both, off by
# default. A failed publish never blocks chat or a print. Neither
# channel's credential is a setting: the MQTT password is MQTT_PASSWORD
# and the ntfy access token is NTFY_ACCESS_TOKEN, both environment only.
mqtt_enabled = false
mqtt_host = ""
mqtt_port = 1883
mqtt_topic = "print-handy"
mqtt_username = ""
ntfy_enabled = false
# The ntfy server (https://ntfy.sh or a self-hosted one); the topic URL
# may name the topic itself, or set ntfy_topic and it is appended.
ntfy_url = ""
ntfy_topic = ""

[maintenance]
quick_hours = 25
full_hours = 75
full_days = 30
