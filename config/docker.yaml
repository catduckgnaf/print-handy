# Docker defaults for Print Handy. Override with PRINT_HANDY__SECTION__KEY.
# Legacy config/docker.toml remains supported when explicitly selected.
#
# More than one printer (#257 Stage 2): declare a roster in YOUR mounted config
# file instead of the single-printer sections above — the list is file-only.
# Copy this file, delete the per-printer sections (printer/services URLs/bambu/
# prusa/elegoo_sdcp/flashforge_stock values), and write entries like:
#
# printers:
#   - id: garage-a1            # slug; names its state folder under state/printers/
#     name: Garage A1
#     model: bambulab.a1
#     chat_id: "<a1-channel-id>"   # its own channel; empty = the global chat
#     lan_host: "<a1-lan-ip>"
#     lan_serial: "<a1-serial>"
#   - id: workshop-ad5x
#     name: Workshop AD5X
#     model: flashforge.ad5x
#     moonraker_url: "http://<ad5x-lan-ip>:7125"
#
# One entry value can be overridden with PRINT_HANDY__PRINTERS__<ID>__<KEY>.
# Full reference: docs/SETTINGS.md, "Printers list".
orca:
  # Source-installed binary; requires WITH_ORCA=true at image build time
  command:
    - /usr/local/bin/orca-slicer
bambu:
  # Source-installed binary; requires WITH_BAMBU=true at image build time.
  # The default slicer for Bambu Lab printers; elsewhere only Orca's one-shot fallback.
  command:
    - /usr/bin/bambu-studio
  # Read-only LAN telemetry (#187): set via PRINT_HANDY__BAMBU__LAN_HOST / __LAN_SERIAL;
  # the access code comes from the BAMBU_LAN_PASSWORD environment secret, never from a file.
  lan_host: ""
  lan_serial: ""
  lan_access_code_env: BAMBU_LAN_PASSWORD
paths:
  hermes_home: /data/hermes
  archive: /data/archive
  records_vault: /data/records
  cache: /data/cache
  hermes_bin: /usr/local/bin/hermes
  ffmpeg: ffmpeg
  hermes_agent: /data/hermes/hermes-agent
  hermes_restart_helper: /data/hermes/restart_hermes.py
services:
  # Runtime paths: Spoolman is loopback only inside the combined container.
  moonraker_url: ""
  moonraker_ws_url: ""
  # Which camera still images come from (#294): auto follows the printer
  # vendor's rule; or pin moonraker, bambu, go2rtc, or none.
  camera_source: "auto"
  camera_snapshot_url: ""
  spoolman_url: "http://127.0.0.1:8000"
  openviking_url: ""
  vision_chat_url: ""
  stock_api_port: 8898
printer:
  # Override with PRINT_HANDY__PRINTER__MODEL=sovol.sv06 etc.
  model: klipper.generic
spool:
  # Ask for brand/vendor in the new-spool walkthrough (#512); off by default.
  prompt_brand: false
timelapse:
  # Mode (#246/#295): rendered, container or off. Empty derives: rendered
  # when a Moonraker URL is configured, else container when capture_enabled
  # is true, else off.
  mode: ""
webui:
  # Optional Web UI (#286). The container serves it by default on port 8088
  # (#708); it is reachable from outside only where the port is published
  # (the Unraid template maps it; Compose leaves that commented out). The
  # access token itself never goes in a file here; access_token_env names
  # the environment variable holding it.
  enabled: true
  host: "0.0.0.0"
  port: 8088
  access_token_env: WEBUI_ACCESS_TOKEN
  # false turns the access token off entirely, even on a LAN bind: anyone who
  # can reach the port gets the Web UI. Only for a network you trust. With
  # true and no token, the first visit shows the setup page (#708): set a
  # password or confirm it should stay open.
  require_auth: true
  # Printer control routes (#708); off by default (403, nothing sent). See docs/WEBUI.md.
  controls_enabled: false
agent:
  # Stray-chat agent lane (#524 stage 3): an agent endpoint — any
  # OpenAI-compatible chat completions URL, e.g. a Hermes agent behind
  # its API — that answers Discord free text the handlers did not take,
  # ahead of the [llm] call. Empty chat_url: no agent lane. The endpoint
  # answers in its own voice; its replies are posted as-is and can never
  # run a command. model is optional: empty omits it from the request.
  # PRINT_HANDY__DISCORD__CHAT_LLM_ENABLED=false turns this lane off too.
  chat_url: ""
  model: ""
  api_key_env: "AGENT_API_KEY"
  timeout_s: 120
design:
  # AI design with OpenSCAD (#388): no enabled key on purpose — unset is
  # AUTO (on whenever a design/LLM endpoint is configured, like roasts).
  # Empty chat_url/model/api_key_env inherit the [llm] values. Force off
  # with PRINT_HANDY__DESIGN__ENABLED=false, or force on with =true plus a
  # model endpoint.
  chat_url: ""
  model: ""
  api_key_env: ""
  timeout_s: 180
  repair_attempts: 3
live_stream:
  # Live camera viewing in Discord (#311): off by default. The bot cannot
  # send video itself; /print-live starts a viewing session and points at
  # the Discord Activity launched in voice_channel_id. The Discord client
  # secret and the Activity session secret are environment secrets, never
  # settings here.
  enabled: false
  voice_channel_id: ""
  auto_start_on_print: false
  max_height: 720
  fps: 15
  max_bitrate_kbps: 2500
  encoder: auto
  empty_timeout_s: 300
  activity_origin: ""
  port: 0
visual_watch:
  # Camera watchdog: alert-only spaghetti, detached-part, empty-bed and stall checks
  # (docs/DOCKER.md "Camera watch"). Override with PRINT_HANDY__VISUAL_WATCH__SENSITIVITY /
  # PRINT_HANDY__VISUAL_WATCH__ENABLED. Sensitivity 1 (quietest) to 5 (most alerts);
  # 3 is the original behavior. Periodic checks run every 1800, 1200, 900, 600 or
  # 450 seconds for levels 1 to 5.
  sensitivity: 3
  enabled: true
