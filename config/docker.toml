# Docker defaults for Print Handy.
# Loaded when PRINT_HANDY_CONFIG=/app/config/docker.toml (set in the image).
# Environment variables PRINT_HANDY__SECTION__KEY override any key here (scalars only).
# Mount a replacement file at the same path to change lists such as orca.command or bed_mm.

[orca]
# Source-installed binary; requires WITH_ORCA=true at image build time
command = ["/usr/local/bin/orca-slicer"]

[bambu]
# Source-installed binary; requires WITH_BAMBU=true at image build time.
# The default slicer for Bambu Lab printers; elsewhere only Orca's one-shot fallback.
command = ["/usr/bin/bambu-studio"]
# Read-only LAN telemetry (#187); access code only via the BAMBU_LAN_PASSWORD env secret.
lan_host = ""
lan_serial = ""
lan_access_code_env = "BAMBU_LAN_PASSWORD"

[paths]
# The state volume's neutral name since 2.2.5 (#914); the key keeps its
# historical name. /data/hermes (the pre-2.2.5 path) stays accepted: the
# entrypoint links /data/state to it when only the legacy volume holds
# data, and pointing this at /data/hermes explicitly still works.
state_home = "/data/state"
archive = "/data/archive"
records_vault = "/data/records"
cache = "/data/cache"
ffmpeg = "ffmpeg"
piper = "piper"
piper_model = ""

[services]
# Set via env or mount a local.toml / override this file
moonraker_url = ""
moonraker_ws_url = ""
# Which camera still images come from (#294): auto follows the printer
# vendor's rule; or pin moonraker, bambu, go2rtc, or none.
camera_source = "auto"
camera_snapshot_url = ""
spoolman_url = "http://127.0.0.1:8000"
vision_chat_url = ""
stock_api_port = 8898

[printer]
# Override with PRINT_HANDY__PRINTER__MODEL=sovol.sv06 etc.
model = "klipper.generic"

[spool]
# Ask for brand/vendor in the new-spool walkthrough (#512); off by default.
prompt_brand = false

[timelapse]
# Mode (#246/#295): rendered, container or off. Empty derives: rendered
# when a Moonraker URL is configured, else container when capture_enabled
# is true, else off.
mode = ""

[webui]
# Optional Web UI (#286). The container serves it by default on port 8088
# (#708); it is reachable from outside only where the port is published
# (the Unraid template maps it; Compose leaves that commented out). The
# access token itself never goes in a file here; access_token_env names
# the environment variable holding it.
enabled = true
host = "0.0.0.0"
port = 8088
access_token_env = "WEBUI_ACCESS_TOKEN"
# false turns the access token off entirely, even on a LAN bind: anyone who
# can reach the port gets the Web UI. Only for a network you trust. With
# true and no token, the first visit shows the setup page (#708): set a
# password or confirm it should stay open.
require_auth = true
# Printer control routes (#708); off by default (403, nothing sent). See docs/WEBUI.md.
controls_enabled = false
# When true, marks the Web UI session cookie Secure so browsers only transmit
# it over HTTPS. Keep false for plain-HTTP LAN access so browsers accept the
# cookie; set true when exposing the Web UI through an HTTPS reverse proxy.
cookie_secure = false
# Web chat's stray-chat model switch. Off by default (AI is for designing
# models): web chat is a pure bot, commands still work and no model call is
# made for web chat text. true lets the [llm]/[agent] lane answer it.
chat_llm_enabled = false
# The Web UI chat page switch: off shows a disabled page and web chat
# processes nothing. Separate from chat_llm_enabled above, which only
# governs web chat's stray-chat model lane.
chat_enabled = true

[agent]
# Stray-chat agent lane (#524 stage 3): an agent endpoint — any
# OpenAI-compatible chat completions URL, e.g. a Hermes agent behind its
# API — that answers Discord free text the handlers did not take, ahead of
# the [llm] call. Empty chat_url: no agent lane. The endpoint answers in
# its own voice; its replies are posted as-is and can never run a command.
# model is optional: empty omits it from the request.
# The lane only runs with discord.chat_llm_enabled (or webui.chat_llm_enabled)
# set to true; both are off by default.
chat_url = ""
model = ""
api_key_env = "AGENT_API_KEY"
timeout_s = 120

[design]
# AI design with OpenSCAD (#388): no enabled key on purpose — unset is
# AUTO (on whenever a design/LLM endpoint is configured, like roasts).
# Empty chat_url/model/api_key_env inherit the [llm] values. Force off
# with PRINT_HANDY__DESIGN__ENABLED=false, or force on with =true.
chat_url = ""
model = ""
api_key_env = ""
timeout_s = 180
repair_attempts = 3

[live_stream]
# Live camera viewing in Discord (#311): off by default. The bot cannot
# send video itself; /print-live starts a viewing session and points at
# the Discord Activity launched in voice_channel_id. The Discord client
# secret and the Activity session secret are environment secrets, never
# settings here.
enabled = false
voice_channel_id = ""
auto_start_on_print = false
max_height = 720
fps = 15
max_bitrate_kbps = 2500
encoder = "auto"
empty_timeout_s = 300
activity_origin = ""
port = 0

[visual_watch]
# Camera watchdog: alert-only spaghetti, detached-part, empty-bed and stall checks
# (docs/DOCKER.md "Camera watch"). Override with PRINT_HANDY__VISUAL_WATCH__SENSITIVITY /
# PRINT_HANDY__VISUAL_WATCH__ENABLED. Sensitivity 1 (quietest) to 5 (most alerts);
# 3 is the original behavior. Periodic checks run every 1800, 1200, 900, 600 or
# 450 seconds for levels 1 to 5.
sensitivity = 3
enabled = true
# Early-layer mode (#913): a risky print (slicer finding, "print anyway" override or an
# operator supports decision) is checked on every layer change for its first early_layers
# layers, and at least every early_interval_s seconds until then. Normal prints unchanged.
early_layers = 10
early_interval_s = 120
# auto_pause_early PAUSES THE PRINTER. When true, two suspicious verdicts in a row
# (spaghetti, detached or air) inside the early-layer window send PAUSE through the alert
# pause path. Env: PRINT_HANDY__VISUAL_WATCH__AUTO_PAUSE_EARLY. It never cancels; the alert keeps its stop and resume buttons. Off by default.
auto_pause_early = false

[logging]
# Daily app log files on the state volume, so they survive a container recreate
# (docker logs does not). Override with PRINT_HANDY__LOGGING__FILE (empty: stderr only)
# and PRINT_HANDY__LOGGING__RETENTION_DAYS.
file = "/data/state/logs/print-handy.log"
retention_days = 14
