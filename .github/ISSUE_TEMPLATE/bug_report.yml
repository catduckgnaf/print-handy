name: Bug report
description: Something is not working as documented or expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. A few ground rules before you start:

        - Search open and closed issues first; duplicates are closed with a link to the canonical issue.
        - Remove credentials, tokens, private model files and personal runtime records from anything you paste.
        - A bug report never authorises anyone to operate a live printer. If the problem involves unexpected motion, heating or an ignored confirmation, say so in the first line of the summary so it can be prioritised.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe the observed behaviour. State measured facts, and label anything estimated or suspected as such.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: The behaviour the documentation or the interface led you to expect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact inputs and flow — model link or file type, the Discord command or UI path, and the settings that matter. Note whether this was offline analysis or a live printer flow.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Print Handy version
      description: Release version, image tag, or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Print Handy installed?
      options:
        - Docker image
        - Standalone (install.sh)
        - Hermes plugin
        - Development checkout
        - Other
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer and firmware
      description: Printer model and firmware or mod (for example "Flashforge AD5X with ZMod"). Write "Not applicable" for purely offline problems.
    validations:
      required: false
  - type: input
    id: profile
    attributes:
      label: Printer / slicer profile
      description: The Print Handy printer profile and any slicer profile involved, if relevant.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant log lines, the exact error text, or measurements that show the problem. Do not present a cause as verified when it is a hypothesis — say what evidence would settle it. Redact secrets before pasting.
    validations:
      required: true
  - type: textarea
    id: diagnostics_bundle
    attributes:
      label: Diagnostics bundle
      description: Run `/print-handy bundle` in Discord (or `python3 -m print_handy.diagnostics_bundle` on the host) and attach the generated diagnostics-bundle.md file to this issue, or paste its Doctor section here. The bundle is redacted — it contains versions, a configuration summary with secret values removed, the printer roster, doctor output and a bounded log tail. Review it before attaching. Required for bug reports: the Issue policy check labels a report `needs-info` until a bundle or sanitization report is present. Do not paste local paths, host names, private addresses or accounts; the Public text policy check flags them.
    validations:
      required: false
  - type: input
    id: debug_session
    attributes:
      label: Debug session ID
      description: If you captured the problem in debug log mode (`/print-handy debug on`, reproduce, `/print-handy debug off`), the session ID from the bot's reply or the export file name (`print-handy-debug-<date>-<session>.md`). Write "Not applicable" otherwise.
    validations:
      required: false
  - type: textarea
    id: sanitization_report
    attributes:
      label: Sanitization report
      description: Paste the counts-only sanitization report from the debug export or diagnostics bundle (its first line starts with "Sanitization report" and lists removals by category, ending with the verification-pass result). It lists what was removed by category — never the removed values — so reviewers can see the export was checked before it was attached.
    validations:
      required: false
  - type: checkboxes
    id: attestations
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I removed credentials, tokens, private model files and personal data from this report.
          required: true
