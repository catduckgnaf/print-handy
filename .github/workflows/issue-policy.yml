name: Issue policy

# Bug reports must carry sanitized logs and evidence. This labels and comments;
# it never closes an issue. Issue text is read through the API into a JSON file
# and never interpolated into a command.

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-policy-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issue-policy:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const issue = context.payload.issue;
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'issue.json'),
              JSON.stringify({body: issue.body || '', labels: issue.labels.map(l => l.name)}));
      - name: Check bug report completeness
        id: policy
        run: |
          set +e
          python scripts/check_issue_policy.py --metadata "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue.out"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/issue.out"
      - name: Label and explain what is missing
        if: steps.policy.outputs.status != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const out = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'issue.out'), 'utf8').trim();
            const number = context.payload.issue.number;
            await github.rest.issues.addLabels({...context.repo, issue_number: number, labels: ['needs-info']}).catch(() => {});
            const marker = '<!-- issue-policy -->';
            const text = marker + '\nThis bug report is missing information needed to triage it:\n\n```\n' + out + '\n```\n' +
              'Run `/print-handy bundle` in Discord (or `python3 -m print_handy.diagnostics_bundle`), review the sanitized file, and attach it. ' +
              'Do not paste private paths, hostnames, addresses or accounts.';
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: number, per_page: 100});
            const mine = comments.find(c => (c.body || '').startsWith(marker));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body: text});
            else await github.rest.issues.createComment({...context.repo, issue_number: number, body: text});
      - name: Clear the label once complete
        if: steps.policy.outputs.status == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.removeLabel({...context.repo, issue_number: context.payload.issue.number, name: 'needs-info'}).catch(() => {});
      - name: Regression tests
        run: python -B -m unittest discover -s tests -p test_issue_policy.py
