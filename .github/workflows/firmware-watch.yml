name: Firmware watch

# Weekly check for newer releases of printer firmware Print Handy
# audits (issues #1271, #1280). Separate from the upstream watch: that
# one compares shipped pins of bundled tools, this one compares the
# baselines recorded in the docs (for ZMod, the audited-against
# version in docs/ZMOD.md; for Klipper, Moonraker, OctoPrint, Marlin,
# Prusa Buddy per printer line and QIDI per model,
# docs/firmware-baselines.toml), which move only when an audit lands.
# scripts/check_firmware_releases.py reads the baselines from this
# checkout, compares them with each watched firmware's GitHub releases
# (Git tags for Klipper and Moonraker) and opens one deduplicated
# `firmware-watch` issue per newer release, closing it again once
# the baseline catches up. Notification only: the workflow never
# edits a baseline, never opens a bump PR and never contacts a
# printer. A notice is not an audit.

on:
  schedule:
    # Tuesdays 13:47 UTC. The odd minute avoids the top-of-hour
    # scheduler rush; the different day spreads it from the Monday
    # upstream watch.
    - cron: "47 13 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One run at a time: a dispatch overlapping the scheduled run must not
# let two runs read the same issue list and both open a notice.
concurrency:
  group: firmware-watch
  cancel-in-progress: false

jobs:
  check-firmware-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The script only reads the checkout; it never pushes, so the
          # token is not left in the git config.
          persist-credentials: false
      - name: Check firmware releases against the audited baselines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_firmware_releases.py
