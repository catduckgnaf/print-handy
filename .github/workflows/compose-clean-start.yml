name: Clean-directory Compose startup

# Builds and runs only an ephemeral local image on a GitHub-hosted runner.
# No registry push, publication, deployment, live adapter, or self-hosted runner.
# readme-quickstart runs README.md's own "Get started" blocks verbatim (one documented
# substitution: the downloads come from this checkout) and asks the bot for /print-help
# through the Web UI chat. See tests/docker/readme_quickstart.py.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'README.md'
      - 'tests/docker/**'
      - '.github/workflows/compose-clean-start.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request: a newer push to the same PR cancels the run in progress. Every other
# event (a dispatch) gets a group of its own, so those runs are never cancelled or
# replaced while queued.
concurrency:
  group: compose-clean-start-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: print-handy-clean-start:${{ github.run_id }}
      APP_CHANNEL: development
      ORT_FLAVOR: cpu
      WITH_ORCA: "false"
      WITH_GO2RTC: "false"
      WITH_BAMBU: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local image without publishing
        run: docker buildx build --load --tag "$IMAGE" --build-arg APP_CHANNEL="$APP_CHANNEL" --build-arg ORT_FLAVOR="$ORT_FLAVOR" --build-arg WITH_ORCA="$WITH_ORCA" --build-arg WITH_GO2RTC="$WITH_GO2RTC" --build-arg WITH_BAMBU="$WITH_BAMBU" .
      - name: First boot from absent bind sources and verify persistence
        run: tests/docker/clean_compose_start.sh "$IMAGE"

  readme-quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: print-handy-readme-quickstart:${{ github.run_id }}
      APP_CHANNEL: development
      ORT_FLAVOR: cpu
      WITH_ORCA: "false"
      WITH_GO2RTC: "false"
      WITH_BAMBU: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local image without publishing
        run: docker buildx build --load --tag "$IMAGE" --build-arg APP_CHANNEL="$APP_CHANNEL" --build-arg ORT_FLAVOR="$ORT_FLAVOR" --build-arg WITH_ORCA="$WITH_ORCA" --build-arg WITH_GO2RTC="$WITH_GO2RTC" --build-arg WITH_BAMBU="$WITH_BAMBU" .
      - name: README quickstart, verbatim, to a /print-help reply in the Web UI chat
        run: python3 tests/docker/readme_quickstart.py "$IMAGE"
