name: Upstream bump

# Opens draft bump PRs for the manually pinned upstream tools
# (Phase A: go2rtc and Spoolman; Phase B: Bambu Studio, whose bump
# also regenerates the HMS error table from the new commit's own
# resources; Phase C: OrcaSlicer, single channel - the target is
# the newest release overall, prereleases included, and the bump
# verifies the new bundle's vendor profiles against the recorded
# identities before opening the PR) when an upstream release is
# newer than the pin and, for finals, at least 3 days old.
# Identity comes from
# the print-handy-upstream-bot GitHub App so the PRs trigger CI
# normally; until catduck adds the UPSTREAM_BOT_APP_ID /
# UPSTREAM_BOT_PRIVATE_KEY secrets this workflow is deliberately
# inert: it prints a notice and exits 0 without changing anything.
# It never merges. The companion upstream-bump-ready.yml flips a
# bump PR from draft to ready once its CI suite is green. When an
# identity is configured, a diagnosis step runs before the token
# mint: it asks GitHub which app the secret pair identifies and
# whether that app is installed on this repository, so a broken
# identity fails with the named cause instead of the mint step's
# bare HTTP 404 (#950).

on:
  schedule:
    # Mondays 15:07 UTC - after the upstream-watch workflow's slot.
    - cron: "7 15 * * 1"
  workflow_dispatch:
    inputs:
      component:
        description: "Component to check for a bump"
        type: choice
        options:
          - all
          - go2rtc
          - spoolman
          - bambu
          - orca
        default: all

permissions:
  contents: read

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    # 45 minutes of headroom: a Bambu bump fetches the new
    # commit's resources/hms files from Bambu Studio (a blob-less
    # sparse fetch) to regenerate the HMS table from them, and an
    # Orca bump downloads the ~200 MB AppImage, extracts it,
    # sparse-fetches the source tree's resources/profiles at the
    # same commit, and sweeps every recorded model's profiles in
    # both packagings before it may open a PR.
    timeout-minutes: 45
    steps:
      # persist-credentials: false - the checkout must not store the
      # workflow token as a git auth extraheader; that header would
      # override the app-token remote URL below and pushes would
      # authenticate as the (read-only) workflow token instead.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check upstream bot identity
        id: identity
        env:
          UPSTREAM_BOT_APP_ID: ${{ secrets.UPSTREAM_BOT_APP_ID }}
          UPSTREAM_BOT_PRIVATE_KEY: ${{ secrets.UPSTREAM_BOT_PRIVATE_KEY }}
        run: python3 scripts/bump_upstream.py --check-identity >> "$GITHUB_OUTPUT"

      - name: Notice when inert
        if: steps.identity.outputs.configured != 'true'
        run: |
          echo "::notice::Upstream bump automation is inert: the upstream bot identity is not configured (secrets UPSTREAM_BOT_APP_ID / UPSTREAM_BOT_PRIVATE_KEY - see the setup checklist). Nothing was changed."

      - name: Diagnose upstream bot identity
        if: steps.identity.outputs.configured == 'true'
        env:
          UPSTREAM_BOT_APP_ID: ${{ secrets.UPSTREAM_BOT_APP_ID }}
          UPSTREAM_BOT_PRIVATE_KEY: ${{ secrets.UPSTREAM_BOT_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/bump_upstream.py --diagnose-identity

      - name: Mint upstream bot token
        id: app-token
        if: steps.identity.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.UPSTREAM_BOT_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_BOT_PRIVATE_KEY }}

      - name: Point git at the bot token
        if: steps.identity.outputs.configured == 'true'
        env:
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Run the bump automation
        if: steps.identity.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/bump_upstream.py --component "${{ inputs.component || 'all' }}"
