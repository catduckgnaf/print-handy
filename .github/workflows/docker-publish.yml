name: Publish Docker image to GHCR (manual)

# Inert until a maintainer dispatches it. Builds every platform leg on a
# native runner, validates each one offline, and only then pushes by digest.
# A final manifest job combines the accepted per-architecture digests into the
# published multi-arch tags. See docs/DOCKER.md for the supported platforms.
#
# Release surfaces gate: the surfaces-gate job runs first on every dispatch
# of this workflow (version releases only — nightly has its own workflow,
# .github/workflows/nightly.yml, and is never gated). It checks that the
# README and package version match the version being published and that
# the GitHub Pages site (catduckgnaf/print-handy-docs) has no drift
# against docs/ at this ref, using the docs repo's own drift definition.
# Candidate dispatches (publish=false) only warn; a publication dispatch
# (publish=true) fails here, before any image is built or pushed, until
# the stale surfaces listed in the gate report are fixed (the remedy —
# the Docs auto-sync in print-handy-docs — is printed in the report).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in MAJOR.MINOR.PATCH form
        type: string
        required: true
      publish:
        description: Push by digest and publish manifests only after every leg passes acceptance (false is a no-push candidate)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  surfaces-gate:
    name: Release surfaces gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      move_latest: ${{ steps.guard.outputs.move_latest }}
    env:
      # Inputs reach the shell only as environment variables, never interpolated into scripts.
      PUBLISH_VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The guard needs main and every tag to test reachability.
          fetch-depth: 0
      - name: Publish ref guard (tag on main, CI green, checklist closed)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/check_publish_ref.py
      - name: Clone the docs site for the drift comparison
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/catduckgnaf/print-handy-docs.git "$RUNNER_TEMP/print-handy-docs"
      - name: Check release surfaces (README, version and Pages drift)
        env:
          DOCS_DIR: ${{ runner.temp }}/print-handy-docs
        run: python3 scripts/check_release_surfaces.py

  build:
    name: Build (${{ matrix.arch }})
    # The surfaces gate runs first: on a publication dispatch it fails the
    # run before any image is built or pushed when a surface is stale.
    needs: surfaces-gate
    # Native runners only: arm64 builds run on a real arm64 runner, never under
    # QEMU emulation. One image is published (#353): the full image
    # (WITH_ORCA=true + WITH_GO2RTC=true) on linux/amd64 and linux/arm64.
    # Bambu Studio stays out of the published image (WITH_BAMBU=false).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      IMAGE: ghcr.io/catduckgnaf/print-handy
      APP_CHANNEL: stable
      # Inputs reach the shell only as environment variables, never interpolated into scripts.
      PUBLISH_VERSION: ${{ inputs.version }}
      # Matrix values reach the shell only as environment variables too.
      ARCH: ${{ matrix.arch }}
      RUNNER_LABEL: ${{ matrix.runner }}
      PLATFORM: ${{ matrix.platform }}
      WITH_ORCA: "true"
      WITH_GO2RTC: "true"
      WITH_BAMBU: "false"
      SPOOLMAN_MODE: included
      LOCAL_IMAGE: print-handy-publish-candidate:${{ inputs.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the lifecycle gate reads the previous release's
          # .env.example from its tag (tests/docker/lifecycle_gate.sh).
          fetch-depth: 0
      - name: Validate release version and prepare evidence
        run: |
          set -euo pipefail
          [[ "$PUBLISH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use MAJOR.MINOR.PATCH numeric form" >&2
            exit 1
          }
          mkdir -p evidence
          {
            echo "source_sha=$GITHUB_SHA"
            echo "version=$PUBLISH_VERSION"
            echo "arch=$ARCH platform=$PLATFORM runner=$RUNNER_LABEL"
            echo "app_channel=$APP_CHANNEL with_orca=$WITH_ORCA with_go2rtc=$WITH_GO2RTC with_bambu=$WITH_BAMBU spoolman=$SPOOLMAN_MODE"
          } | tee evidence/pins.txt
      - name: Free runner disk for the slicer build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tee evidence/disk.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          # Must be docker-container: the legs push by digest, which the
          # docker driver does not implement (every leg of nightly run
          # 40330775729 passed acceptance and then failed at the push step
          # with exactly that error).
          driver: docker-container
      - name: Build image once (no push)
        run: |
          set -euo pipefail
          start=$(date -u +%FT%TZ)
          docker buildx build --platform "$PLATFORM" --progress=plain --load -t "$LOCAL_IMAGE" \
            --build-arg "APP_CHANNEL=$APP_CHANNEL" \
            --build-arg "WITH_ORCA=$WITH_ORCA" \
            --build-arg "WITH_GO2RTC=$WITH_GO2RTC" \
            --build-arg "WITH_BAMBU=$WITH_BAMBU" \
            --label "org.opencontainers.image.source=https://github.com/catduckgnaf/print-handy" \
            --label "org.opencontainers.image.version=$PUBLISH_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            . 2>&1 | tee evidence/build.log
          {
            echo "build_start=$start"
            echo "build_end=$(date -u +%FT%TZ)"
            echo "image_id=$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")"
            docker image inspect --format 'platform={{.Os}}/{{.Architecture}} size={{.Size}}' "$LOCAL_IMAGE"
          } | tee evidence/identity.txt
      - name: Headless slice with the bundled Orca
        run: |
          set -euo pipefail
          channels="stable"
          for channel in $channels; do
            docker run --rm --network none --cpus 2 --memory 4g --pids-limit 256 \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --tmpfs /data:uid=1000,gid=1000,size=512m \
              -e "PRINT_HANDY_ORCA_CHANNEL=$channel" \
              "$LOCAL_IMAGE" python3 /app/docker/slicer-smoke.py \
              2>&1 | tee "evidence/slicer-$channel.log"
          done
      - name: Offline runtime acceptance
        id: acceptance
        run: tests/docker/image_acceptance.sh "$LOCAL_IMAGE" "$SPOOLMAN_MODE" evidence/acceptance
      - name: Release lifecycle gate (fresh install, upgrade, restore, downgrade)
        id: lifecycle
        run: |
          set -euo pipefail
          # Upgrade from and downgrade to the release users run today (:latest), pulled
          # read-only. A failure here fails the leg, so the push steps below never run.
          docker pull --platform "$PLATFORM" ghcr.io/catduckgnaf/print-handy:latest
          tests/docker/lifecycle_gate.sh ghcr.io/catduckgnaf/print-handy:latest "$LOCAL_IMAGE" evidence/lifecycle
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: inputs.publish && steps.acceptance.outcome == 'success' && steps.lifecycle.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push accepted image by digest only
        id: publish
        if: inputs.publish && steps.acceptance.outcome == 'success' && steps.lifecycle.outcome == 'success'
        run: |
          set -euo pipefail
          # The identical build is pushed by digest only: no tag is pushed from a
          # build leg. Tags are created later, by the manifest job, from digests.
          docker buildx build --platform "$PLATFORM" --progress=plain \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "evidence/metadata-$ARCH.json" \
            --build-arg "APP_CHANNEL=$APP_CHANNEL" \
            --build-arg "WITH_ORCA=$WITH_ORCA" \
            --build-arg "WITH_GO2RTC=$WITH_GO2RTC" \
            --build-arg "WITH_BAMBU=$WITH_BAMBU" \
            --label "org.opencontainers.image.source=https://github.com/catduckgnaf/print-handy" \
            --label "org.opencontainers.image.version=$PUBLISH_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            . 2>&1 | tee evidence/push.log
          digest=$(python3 -c "import json; print(json.load(open('evidence/metadata-$ARCH.json'))['containerimage.digest'])")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not read the pushed image digest" >&2
            exit 1
          }
          # The push above re-ran the build, so prove the pushed image is
          # the one acceptance ran against before its digest travels on:
          # the config digest the pushed manifest points at must equal the
          # accepted local image's ID. (The context can no longer drift
          # between the two builds either: evidence/ is dockerignored, so
          # this build saw exactly what the accepted build saw.)
          accepted_id=$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")
          # Config digest (classic image store ID) and image-manifest digest (containerd store ID).
          pushed_ids=$(python3 scripts/pushed_image_ids.py "$IMAGE" "$digest" "$PLATFORM")
          pushed_config=$(sed -n 1p <<<"$pushed_ids")
          pushed_manifest=$(sed -n 2p <<<"$pushed_ids")
          [[ "$pushed_config" == "$accepted_id" || "$pushed_manifest" == "$accepted_id" ]] || {
            echo "The image at $digest (config $pushed_config, manifest $pushed_manifest) is not the accepted image $LOCAL_IMAGE ($accepted_id); refusing to hand its digest to the manifest job" >&2
            exit 1
          }
          {
            echo "accepted_image_id=$accepted_id"
            echo "pushed_config_digest=$pushed_config"
            echo "pushed_manifest_digest=$pushed_manifest"
          } | tee evidence/identity-check.txt
          mkdir -p digest-out
          printf '%s\n' "$digest" | tee "digest-out/digest-$ARCH.txt" evidence/digest.txt
          {
            echo "### GHCR image pushed by digest"
            echo
            echo "- Platform: \`$PLATFORM\`"
            echo "- Digest: \`$IMAGE@$digest\`"
            echo "- Source revision: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pushed digest for the manifest job
        if: inputs.publish && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-out/
          retention-days: 30
      - name: Upload build and acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docker-publish-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: evidence/
          retention-days: 30

  manifest:
    name: Publish multi-arch manifests
    # Runs only for a real publication and only when every build leg succeeded;
    # a leg succeeds only when its own acceptance passed before its digest push.
    needs: [build, surfaces-gate]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/catduckgnaf/print-handy
      # Inputs reach the shell only as environment variables, never interpolated into scripts.
      PUBLISH_VERSION: ${{ inputs.version }}
      # Set by the publish ref guard: true only for the highest released version.
      MOVE_LATEST: ${{ needs.surfaces-gate.outputs.move_latest }}
    steps:
      - name: Download the pushed per-arch digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the multi-arch manifests
        run: |
          set -euo pipefail
          [[ "$PUBLISH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use MAJOR.MINOR.PATCH numeric form" >&2
            exit 1
          }
          mkdir -p evidence
          read_digest() {
            local file="digests/digest-$1.txt"
            [[ -f "$file" ]] || { echo "missing pushed digest for arch $1" >&2; exit 1; }
            local digest
            digest=$(tr -d '[:space:]' < "$file")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid digest in $file" >&2; exit 1; }
            printf '%s' "$digest"
          }
          full_amd64=$(read_digest amd64)
          full_arm64=$(read_digest arm64)
          {
            echo "full_amd64=$full_amd64"
            echo "full_arm64=$full_arm64"
          } | tee evidence/digests.txt
          # One image (#353): the version tag and the floating latest tag.
          docker buildx imagetools create -t "$IMAGE:$PUBLISH_VERSION" \
            "$IMAGE@$full_amd64" "$IMAGE@$full_arm64" 2>&1 | tee evidence/manifest-version.log
          tags="$PUBLISH_VERSION"
          if [[ "$MOVE_LATEST" == "true" ]]; then
            docker buildx imagetools create -t "$IMAGE:latest" \
              "$IMAGE@$full_amd64" "$IMAGE@$full_arm64" 2>&1 | tee evidence/manifest-latest.log
            tags="$PUBLISH_VERSION latest"
          else
            echo ":latest not moved: $PUBLISH_VERSION is not the highest released version" | tee evidence/manifest-latest.log
          fi
          {
            echo "### GHCR multi-arch manifests published"
            echo
            for tag in $tags; do
              manifest_digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$tag" | sha256sum | cut -d ' ' -f 1)"
              echo "- \`$IMAGE:$tag\` manifest digest: \`$manifest_digest\`"
              echo "$tag=$manifest_digest"
            done
            echo "- Source revision: \`$GITHUB_SHA\`"
          } | tee evidence/manifests.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload manifest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docker-publish-manifests-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
