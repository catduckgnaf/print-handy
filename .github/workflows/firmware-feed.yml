name: Firmware feed

# Publishes firmware-feed.json: the newest release of every firmware
# Print Handy follows (issue #1280 section I). Every install reads that
# one public file to tell an owner about a new firmware release and to
# fill the Web UI Firmware page, instead of each install spending its
# own unauthenticated GitHub API budget per firmware.
#
# scripts/build_firmware_feed.py reads docs/firmware-feed.toml from this
# checkout, asks GitHub for each firmware's releases or tags, and writes
# the feed. This workflow commits it to the `firmware-feed` branch, which
# holds that one file and nothing else, only when its content changed.
#
# Separate from the weekly firmware watch on purpose: the watch compares
# upstream with the versions Print Handy was audited against and opens
# issues for maintainers; the feed tells owners what upstream has
# published. Neither edits a baseline, opens a bump PR or contacts a
# printer. How to add a firmware: docs/FIRMWARE-FEED.md.

on:
  schedule:
    # Every six hours, at an odd minute to avoid the top-of-hour rush.
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/firmware-feed.toml
      - docs/firmware-baselines.toml
      - docs/ZMOD.md
      - scripts/build_firmware_feed.py
      - .github/workflows/firmware-feed.yml

permissions:
  contents: read

# One run at a time, so two runs never race to push the branch.
concurrency:
  group: firmware-feed
  cancel-in-progress: false

jobs:
  publish-firmware-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes the feed commit to the firmware-feed branch, and nothing else.
      contents: write
    env:
      FEED_BRANCH: firmware-feed
      FEED_FILE: firmware-feed.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The build only reads this checkout; the push below passes the
          # token explicitly, so it is not left in the git config.
          persist-credentials: false
      - name: Fetch the published feed, if there is one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feed"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" "$FEED_BRANCH" >/dev/null; then
            git clone --quiet --depth 1 --branch "$FEED_BRANCH" "$remote" "$RUNNER_TEMP/feed"
          else
            git init --quiet --initial-branch "$FEED_BRANCH" "$RUNNER_TEMP/feed"
            git -C "$RUNNER_TEMP/feed" remote add origin "$remote"
          fi
      - name: Build the feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/build_firmware_feed.py \
            --previous "$RUNNER_TEMP/feed/$FEED_FILE" \
            --output "$RUNNER_TEMP/$FEED_FILE"
      - name: Publish the feed when it changed
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/feed"
          cp "$RUNNER_TEMP/$FEED_FILE" "$FEED_FILE"
          cat > README.md <<'EOF'
          # Print Handy firmware feed

          `firmware-feed.json` is generated by the Firmware feed workflow on
          the main branch. Do not edit it here: change `docs/firmware-feed.toml`
          on main instead. See `docs/FIRMWARE-FEED.md` on main.
          EOF
          git add "$FEED_FILE" README.md
          if git diff --cached --quiet; then
            echo "The feed is unchanged; nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Firmware feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin "HEAD:$FEED_BRANCH"
          echo "Published a new feed."
