name: Model regression corpus

on:
  push:
    branches: [ci/model-corpus-171]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Download and verify corpus release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The corpus repo and its release assets keep their pre-rename
          # print-buddy names: release assets cannot be renamed in place (#486).
          mkdir -p "$RUNNER_TEMP/corpus"
          gh release download corpus-v1 --repo catduckgnaf/print-buddy-corpus --dir "$RUNNER_TEMP/corpus"
          cd "$RUNNER_TEMP/corpus"
          sha256sum -c SHA256SUMS
          tar -xzf print-buddy-corpus-v1.tar.gz
          test "$(find models -type f \( -name '*.3mf' -o -name '*.stl' \) | wc -l)" -eq 171
          # corpus-v2: the #458 complex cases (manifest: tests/corpus/complex_cases.toml).
          mkdir v2 && cd v2
          gh release download corpus-v2 --repo catduckgnaf/print-buddy-corpus --dir .
          sha256sum -c SHA256SUMS
          tar -xzf print-buddy-corpus-v2.tar.gz -C ..
          cd ..
          test "$(find models -type f \( -name '*.3mf' -o -name '*.stl' \) | wc -l)" -gt 171
      - name: Complex corpus manifest contract against the fetched files
        # tests/corpus/test_complex_corpus.py's fetched-files test accepts
        # PRINT_HANDY_PRIVATE_CORPUS (the same root the runner scripts
        # below use) but no workflow ever ran it under pytest, so it
        # skipped in every CI leg. This workflow is the one place the
        # corpus is actually fetched, so the contract runs here, once
        # (shard 0), against the verified download (2026-11-07 test-suite
        # cleanup, round 2).
        if: matrix.shard == 0
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
        run: python -m pytest -v -rs tests/corpus/test_complex_corpus.py
      - name: Run fake-Discord corpus shard
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
          CORPUS_SHARD_INDEX: ${{ matrix.shard }}
          CORPUS_SHARD_COUNT: 6
          CORPUS_WORK: ${{ runner.temp }}/corpus-work
          CORPUS_RESULTS: ${{ runner.temp }}/results-${{ matrix.shard }}.json
        run: python tests/corpus/run_external_corpus.py
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results-${{ matrix.shard }}.json
          if-no-files-found: warn
      - name: Add shard summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          RESULTS: ${{ runner.temp }}/results-${{ matrix.shard }}.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RESULTS'])
          rows = json.loads(p.read_text()) if p.exists() else []
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as f:
              f.write(f"## Corpus shard {os.environ['SHARD']}\n\n| Model | Result | Seconds | Error |\n|---|---:|---:|---|\n")
              for r in rows:
                  f.write(f"| `{r['model']}` | {r['result']} | {r['seconds']:.2f} | {r['error'].replace('|', '/')} |\n")
          PY

  edit-corpus:
    name: External edit corpus (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Download and verify corpus release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          gh release download corpus-v1 --repo catduckgnaf/print-buddy-corpus --dir "$RUNNER_TEMP/corpus"
          cd "$RUNNER_TEMP/corpus"
          sha256sum -c SHA256SUMS
          tar -xzf print-buddy-corpus-v1.tar.gz
          test "$(find models -type f \( -name '*.3mf' -o -name '*.stl' \) | wc -l)" -eq 171
      - name: Run external edit corpus shard
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
          CORPUS_SHARD_INDEX: ${{ matrix.shard }}
          CORPUS_SHARD_COUNT: 3
          CORPUS_WORK: ${{ runner.temp }}/edit-corpus-work
          CORPUS_RESULTS: ${{ runner.temp }}/edit-results-${{ matrix.shard }}.json
        run: python tests/corpus/run_external_edit_corpus.py
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edit-corpus-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/edit-results-${{ matrix.shard }}.json
          if-no-files-found: warn
      - name: Add shard summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          RESULTS: ${{ runner.temp }}/edit-results-${{ matrix.shard }}.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RESULTS'])
          rows = json.loads(p.read_text()) if p.exists() else []
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as f:
              f.write(f"## Edit corpus shard {os.environ['SHARD']}\n\n| Model | Result | Seconds | Error |\n|---|---:|---:|---|\n")
              for r in rows:
                  f.write(f"| `{r['model']}` | {r['result']} | {r['seconds']:.2f} | {r['error'].replace('|', '/')} |\n")
          PY
