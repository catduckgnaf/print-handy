name: Model regression corpus

on:
  push:
    branches: [ci/model-corpus-171]
  workflow_dispatch:
    inputs:
      large_mesh_only:
        description: Run only the large-mesh intake job (#1790)
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  corpus:
    if: ${{ !inputs.large_mesh_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Download and verify corpus release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The corpus repo and its release assets keep their pre-rename
          # The corpus now lives in catduckgnaf/print-handy-corpus. Releases keep
          # their pre-rename tags (corpus-v1/v2) so these download commands are
          # unchanged; each release's outer SHA256SUMS lists the renamed asset,
          # because release assets cannot be renamed in place (#486).
          mkdir -p "$RUNNER_TEMP/corpus"
          gh release download corpus-v1 --repo catduckgnaf/print-handy-corpus --dir "$RUNNER_TEMP/corpus"
          cd "$RUNNER_TEMP/corpus"
          sha256sum -c SHA256SUMS
          tar -xzf print-handy-corpus-v1.tar.gz
          test "$(find models -type f \( -name '*.3mf' -o -name '*.stl' \) | wc -l)" -eq 171
          # corpus-v2: the #458 complex cases (manifest: tests/corpus/complex_cases.toml).
          mkdir v2 && cd v2
          gh release download corpus-v2 --repo catduckgnaf/print-handy-corpus --dir .
          sha256sum -c SHA256SUMS
          tar -xzf print-handy-corpus-v2.tar.gz -C ..
          cd ..
          test "$(find models -type f \( -name '*.3mf' -o -name '*.stl' \) | wc -l)" -gt 171
      - name: Complex corpus manifest contract against the fetched files
        # tests/corpus/test_complex_corpus.py's fetched-files test accepts
        # PRINT_HANDY_PRIVATE_CORPUS (the same root the runner scripts
        # below use) but no workflow ever ran it under pytest, so it
        # skipped in every CI leg. This workflow is the one place the
        # corpus is actually fetched, so the contract runs here, once
        # (shard 0), against the verified download (2026-11-07 test-suite
        # cleanup, round 2).
        if: matrix.shard == 0
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
        run: python -m pytest -v -rs tests/corpus/test_complex_corpus.py
      - name: Wedge-root rule on real corpus models
        # The support-clearance wedge-root rule's real-model cases (#1195):
        # chamfered corpus-v1 models, pinned on the verified download.
        if: matrix.shard == 0
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
        run: python -m pytest -v -rs tests/corpus/test_wedge_root_real_models.py
      - name: Painted fit measures like the written export on real painted models
        # #1246: the measure-only painted fit equals the written export's
        # reports and verdicts on corpus-v1's painted 3MFs (shard 1, to keep
        # it off the shard that runs the two steps above).
        if: matrix.shard == 1
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
        run: python -m pytest -v -rs -k corpus tests/pipeline/test_painted_fit_measure_1246.py
      - name: Run fake-Discord corpus shard
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
          CORPUS_SHARD_INDEX: ${{ matrix.shard }}
          CORPUS_SHARD_COUNT: 6
          CORPUS_WORK: ${{ runner.temp }}/corpus-work
          CORPUS_RESULTS: ${{ runner.temp }}/results-${{ matrix.shard }}.json
        run: python tests/corpus/run_external_corpus.py
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: corpus-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results-${{ matrix.shard }}.json
          if-no-files-found: warn
      - name: Add shard summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          RESULTS: ${{ runner.temp }}/results-${{ matrix.shard }}.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RESULTS'])
          rows = json.loads(p.read_text()) if p.exists() else []
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as f:
              f.write(f"## Corpus shard {os.environ['SHARD']}\n\n| Model | Result | Seconds | Error |\n|---|---:|---:|---|\n")
              for r in rows:
                  f.write(f"| `{r['model']}` | {r['result']} | {r['seconds']:.2f} | {r['error'].replace('|', '/')} |\n")
          PY

  edit-corpus:
    name: External edit corpus (shard ${{ matrix.shard }})
    if: ${{ !inputs.large_mesh_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Download and verify corpus release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          gh release download corpus-v1 --repo catduckgnaf/print-handy-corpus --dir "$RUNNER_TEMP/corpus"
          cd "$RUNNER_TEMP/corpus"
          sha256sum -c SHA256SUMS
          tar -xzf print-handy-corpus-v1.tar.gz
          test "$(find models -type f \( -name '*.3mf' -o -name '*.stl' \) | wc -l)" -eq 171
      - name: Run external edit corpus shard
        env:
          PRINT_HANDY_PRIVATE_CORPUS: ${{ runner.temp }}/corpus/models
          CORPUS_SHARD_INDEX: ${{ matrix.shard }}
          CORPUS_SHARD_COUNT: 3
          CORPUS_WORK: ${{ runner.temp }}/edit-corpus-work
          CORPUS_RESULTS: ${{ runner.temp }}/edit-results-${{ matrix.shard }}.json
        run: python tests/corpus/run_external_edit_corpus.py
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: edit-corpus-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/edit-results-${{ matrix.shard }}.json
          if-no-files-found: warn
      - name: Add shard summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          RESULTS: ${{ runner.temp }}/edit-results-${{ matrix.shard }}.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RESULTS'])
          rows = json.loads(p.read_text()) if p.exists() else []
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as f:
              f.write(f"## Edit corpus shard {os.environ['SHARD']}\n\n| Model | Result | Seconds | Error |\n|---|---:|---:|---|\n")
              for r in rows:
                  f.write(f"| `{r['model']}` | {r['result']} | {r['seconds']:.2f} | {r['error'].replace('|', '/')} |\n")
          PY

  large-mesh:
    # #1790: real multi-MB sources through intake (unit question, load,
    # combine), with the native mesh kernel and on the Python fallback, with
    # stage timings. The files (tests/corpus/large_mesh/*/case.toml) are
    # fetched from their source pinned by SHA-256 and never committed or
    # released. They are kept in this repository's private Actions cache
    # (not public, not a release) so the source site is not asked for 56 MB
    # on every run; fetch.py re-verifies every cached file's size and
    # SHA-256 and downloads only a missing or changed one. A refused or
    # changed download still fails the job instead of skipping the case.
    name: Large-mesh intake (native kernel and Python fallback)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache the pinned Rust toolchain and crates
        # sh.rustup.rs and crates.io were downloaded fresh on every run; on
        # a cache hit scripts/ci_install_rust.sh downloads nothing.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.rust-pinned
          key: rust-1.99.1-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/bounds/Cargo.lock', 'scripts/ci_install_rust.sh') }}
          restore-keys: rust-1.99.1-hosted-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the pinned Rust toolchain
        run: sh scripts/ci_install_rust.sh
      - run: python -m pip install -c constraints.txt ".[test]" "maturin==1.16.0"
      - name: Build the native bounds extension into the source package
        # The same staging as ci.yml's native-bounds job.
        run: |
          mkdir -p native/bounds/print_handy/core
          cp print_handy/__init__.py native/bounds/print_handy/__init__.py
          cp print_handy/core/__init__.py native/bounds/print_handy/core/__init__.py
          (cd native/bounds && maturin build --release --locked)
          python -m pip install native/bounds/target/wheels/*.whl
          PURELIB="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          cp "$PURELIB"/print_handy/core/_bounds_native*.so print_handy/core/
          python -c 'from print_handy.core import _bounds_native as m; print("MESH_KERNEL_VERSION", m.MESH_KERNEL_VERSION)'
      - name: Cache the large-mesh corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/large-mesh
          key: large-mesh-${{ hashFiles('tests/corpus/large_mesh/*/case.toml') }}
      - name: Fetch the large-mesh corpus by SHA-256
        env:
          PRINT_HANDY_LARGE_MESH_CORPUS: ${{ runner.temp }}/large-mesh
        run: python -m tests.corpus.large_mesh.fetch
      - name: Large-mesh intake with the native kernel (budgets enforced)
        env:
          PRINT_HANDY_LARGE_MESH_CORPUS: ${{ runner.temp }}/large-mesh
          PRINT_HANDY_LARGE_MESH_REQUIRE: "1"
          PRINT_HANDY_MESH_REQUIRE_NATIVE: "1"
          PRINT_HANDY_LARGE_MESH_TIMING: ${{ runner.temp }}/large-mesh-timing.jsonl
        run: python -m pytest -v -s -rs tests/corpus/large_mesh
      - name: Large-mesh intake on the numpy twin, kernel off (its own budgets)
        env:
          PRINT_HANDY_LARGE_MESH_CORPUS: ${{ runner.temp }}/large-mesh
          PRINT_HANDY_LARGE_MESH_REQUIRE: "1"
          PRINT_HANDY_LARGE_MESH_ENGINE: numpy
          PRINT_HANDY_LARGE_MESH_TIMING: ${{ runner.temp }}/large-mesh-timing.jsonl
        run: python -m pytest -v -s -rs tests/corpus/large_mesh
      - name: Large-mesh intake on the Python fallback (timed only)
        env:
          PRINT_HANDY_LARGE_MESH_CORPUS: ${{ runner.temp }}/large-mesh
          PRINT_HANDY_LARGE_MESH_REQUIRE: "1"
          PRINT_HANDY_BOUNDS_IMPL: python
          PRINT_HANDY_LARGE_MESH_TIMING: ${{ runner.temp }}/large-mesh-timing.jsonl
        run: python -m pytest -v -s -rs tests/corpus/large_mesh
      - name: Upload stage timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: large-mesh-timing
          path: ${{ runner.temp }}/large-mesh-timing.jsonl
          if-no-files-found: warn
      - name: Add timing summary
        if: always()
        env:
          TIMING: ${{ runner.temp }}/large-mesh-timing.jsonl
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['TIMING'])
          rows = [json.loads(line) for line in p.read_text().splitlines()] if p.exists() else []
          stages = []
          for row in rows:
              stages += [k for k in row if k not in ('case', 'impl', 'native') and k not in stages]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Large-mesh intake stage times (s)\n\n| Case | Path | ' + ' | '.join(stages) + ' |\n')
              f.write('|---|---|' + '---:|' * len(stages) + '\n')
              for row in rows:
                  path = 'native' if row['native'] else 'Python'
                  f.write(f"| `{row['case']}` | {path} | " + ' | '.join(str(row.get(s, '')) for s in stages) + ' |\n')
          PY
