name: Docker static checks

# No container is built, pulled or run: Compose files are only rendered. Image builds and runtime
# acceptance live in docker-image-validation.yml, which runs only when a maintainer dispatches it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    # Debian 13 container; Compose is rendered only and no Docker daemon is used.
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install static-check tools
        run: |
          apt-get update -q
          apt-get install -y -q bash shellcheck curl ca-certificates python3
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
          apt-get update -q
          apt-get install -y -q docker-ce-cli docker-compose-plugin
      - name: Shell syntax and ShellCheck
        run: |
          bash -n docker/entrypoint.sh tests/docker/image_acceptance.sh tests/docker/lifecycle_gate.sh tests/docker/clean_compose_start.sh
          sh -n docker/orca-build-jobs.sh
          shellcheck -x docker/entrypoint.sh docker/orca-build-jobs.sh tests/docker/image_acceptance.sh tests/docker/lifecycle_gate.sh tests/docker/clean_compose_start.sh
      - name: Render every Compose variant (no containers)
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's#^PRINT_HANDY_IMAGE=.*#PRINT_HANDY_IMAGE=print-handy:static-check#' .env
          export ACCEPTANCE_FIXTURES="$PWD/tests/docker" PRINT_HANDY_IMAGE=print-handy:static-check
          for files in \
              "docker-compose.yml" \
              "docker-compose.yml tests/docker/compose.acceptance.yml"; do
            args=(); for f in $files; do args+=(-f "$f"); done
            echo "docker compose ${args[*]} config"
            docker compose "${args[@]}" config --quiet
          done
          # Without an image the base file must refuse to render.
          sed -i 's#^PRINT_HANDY_IMAGE=.*#PRINT_HANDY_IMAGE=#' .env
          unset PRINT_HANDY_IMAGE
          if docker compose config --quiet 2>/dev/null; then echo "rendered without PRINT_HANDY_IMAGE"; exit 1; fi
      - name: Unraid templates parse
        run: |
          for f in docker/unraid/*.xml; do python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$f"; done
