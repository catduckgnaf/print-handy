name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: a description edit would start a newer CI run whose required checks
    # report skipped, and branch protection then blocks a PR whose head already passed.
    # Description edits are handled by the separate Contribution checks workflow.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

defaults:
  run:
    shell: bash

# The one place CI pins the real OrcaSlicer the slicer legs run (scripts/install-orca-flatpak.sh reads
# these). ORCA_BUNDLE_VERSION is the one build docker/orca-prebuilt.sh ships (the stable channel);
# tests/test_orca_pins.py fails when the two disagree or a pin is copied into a job.
env:
  ORCA_BUNDLE_VERSION: 2.5.0
  ORCA_BUNDLE_SHA256: 58c10feaa2df81f6385db628185ee6c5c656391de57974646a5f4dd40e7947b3
  ORCA_RUNTIME_REF: runtime/org.gnome.Platform/x86_64/50
  # Flathub ostree commit of that runtime (Build of the GNOME Runtime from 50.6-18-g0ed65ce92,
  # 2026-10-28), recorded from `flatpak remote-info flathub runtime/org.gnome.Platform/x86_64/50`.
  ORCA_RUNTIME_COMMIT: 4337a389125f814785bd83f4ace01da5b6baa80fdcf5a9c81e60dcd03896c067

jobs:
  edit-corpus-offline:
    name: Edit corpus offline (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Run offline edit corpus shard
        env:
          PRINT_HANDY_EDIT_CORPUS: '1'
          PRINT_HANDY_EDIT_SHARD: '${{ matrix.shard }}/3'
        run: python -m pytest -q -s tests/corpus/edit

  edit-corpus-offline-result:
    if: always()
    needs: edit-corpus-offline
    name: Edit corpus (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All offline edit corpus shards passed
        run: test "${{ needs.edit-corpus-offline.result }}" = success

  edit-corpus-real:
    name: Edit corpus (stable, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      ORCA_FLATPAK_APP_ID: com.orcaslicer.OrcaSlicer
      PRINT_HANDY_REAL_SLICER: "1"
      PRINT_HANDY_EDIT_CORPUS: "1"
      PRINT_HANDY_EDIT_SHARD: "${{ matrix.shard }}/3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache the pinned OrcaSlicer bundle and runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/orcaslicer-v${{ env.ORCA_BUNDLE_VERSION }}.flatpak
            ~/.local/share/flatpak
          key: orcaslicer-flatpak-v${{ env.ORCA_BUNDLE_VERSION }}-${{ env.ORCA_RUNTIME_COMMIT }}-${{ runner.os }}-x86_64
      - name: Install the pinned OrcaSlicer bundle and GNOME runtime
        run: sh scripts/install-orca-flatpak.sh
      - name: Run real-Orca edit corpus shard
        run: xvfb-run -a python -m pytest -v -s tests/corpus/edit

  offline-tests:
    # Three shards per Python run in parallel (tests/conftest.py, PRINT_HANDY_TEST_SHARD). The
    # offline-tests-result job reports the per-Python check names branch protection requires.
    name: offline-tests (${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04  # Debian 13 container; hosted runner supplies the VM only.
    container:
      image: python:${{ matrix.python-version }}-slim-trixie
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        shard: [0, 1, 2]
    steps:
      # Tests inspect tracked files and ignore rules, so checkout needs real Git metadata.
      - name: Install Git before checkout
        run: |
          command -v git || { apt-get update -q && apt-get install -y -q git; }
          git --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Normalize checkout ownership for Git subprocesses
        # checkout's safe.directory lives in its temporary HOME, not the test process HOME.
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
      - run: python -m pip install ".[test]"
      - name: Ruff (syntax and undefined names, whole tree)
        run: python -m ruff check .
      - name: Install ffmpeg for the timelapse tests
        # ffmpeg is a shipped runtime dependency (the image's runtime stage
        # installs it); the offline legs install it too, so the timelapse
        # delivery/encode tests execute here instead of skipping (#373).
        run: |
          command -v ffmpeg || { apt-get update -q && apt-get install -y -q ffmpeg; }
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install jq for the shell CLI tests
        # jq is a shipped runtime dependency (the image's runtime stage
        # installs it; bin/moonrakerctl parses Moonraker JSON with it); the
        # offline legs install it too, so the shell CLI tests in
        # tests/pipeline execute here instead of skipping.
        run: |
          command -v jq || { apt-get update -q && apt-get install -y -q jq; }
          jq --version
      - name: Install OpenSCAD, xvfb and tesseract for the design and label tests
        # Same pattern as ffmpeg and jq above: openscad, xvfb and
        # tesseract-ocr are shipped runtime dependencies (the Dockerfile
        # runtime stage installs all three — openscad for the design/CAD
        # features, tesseract for spool label OCR). The offline legs install
        # them too, so the design, render-preview and label-OCR tests
        # execute here instead of skipping (2026-11-07 test-suite cleanup).
        run: |
          command -v openscad && command -v xvfb-run && command -v tesseract || { apt-get update -q && apt-get install -y -q openscad xvfb xauth tesseract-ocr; }
          openscad --version
          tesseract --version | head -n 1
      - name: Install Node.js for the Cloudflare Worker example tests
        # Same pattern as the shipped-binary installs above: the reference
        # Cloudflare Workers in examples/cloudflare are shipped product
        # surface (the documented opt-in stateless fuzzy/vision layer), and
        # their tests use Node's built-in runner. The Workers run on
        # Cloudflare, not in the image, so Node is a test-only tool here;
        # the offline legs install it so tests/test_cloudflare_examples.py
        # executes instead of skipping with "node is not installed"
        # (2026-11-07 test-suite cleanup, round 2).
        run: |
          command -v node || { apt-get update -q && apt-get install -y -q nodejs; }
          node --version
      - name: Build the native bounds extension for the offline legs
        # The dedicated native-bounds job builds the Rust/PyO3 extension
        # (#952) and runs tests/pipeline/test_native_bounds.py against it.
        # The offline legs build it the same way so the native corpus cases
        # in that file execute here too instead of skipping; the test step
        # below sets PRINT_HANDY_BOUNDS_REQUIRE_NATIVE=1 so a missing
        # extension is a hard failure here, never a silent skip.
        run: |
          command -v cargo || { apt-get update -q && apt-get install -y -q curl gcc; curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1; }
          export PATH="$HOME/.cargo/bin:$PATH"
          python -m pip install "maturin==1.16.0"
          mkdir -p native/bounds/print_handy/core
          cp print_handy/__init__.py native/bounds/print_handy/__init__.py
          cp print_handy/core/__init__.py native/bounds/print_handy/core/__init__.py
          (cd native/bounds && maturin build --release --locked)
          python -m pip install native/bounds/target/wheels/*.whl
          PURELIB="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          cp "$PURELIB"/print_handy/core/_bounds_native*.so print_handy/core/
          python -c 'import print_handy.core._bounds_native'
      - name: Strict xfail register
        # Every strict xfail needs an owner and an unexpired date. Runs before
        # the suite so an unregistered marker fails even when its test xpasses.
        run: python3 scripts/check_strict_xfails.py
      # Coverage is report-only (codecov.yml): only the 3.12 legs are
      # instrumented, each shard uploads its own report and Codecov merges
      # them per commit, so patch coverage reflects the whole offline suite.
      # The 3.14 legs stay uninstrumented as a timing cross-check, and no
      # timed job (discord-timing, slicer timing) is ever instrumented.
      # The instrumented legs use coverage's sysmon core (sys.monitoring):
      # the default C tracer made the million-triangle audit test
      # (tests/corpus/test_corpus.py, 120 s budget) take over 3x as long
      # locally and pushed it past its budget in CI, while sysmon measured
      # within ~10% of the uninstrumented run.
      - name: Offline tests (no printer, no slicer, no network)
        timeout-minutes: 25
        env:
          PRINT_HANDY_TEST_SHARD: ${{ matrix.shard }}/3
          # #971: this job is where the container-marked tests keep running
          # in CI. The job itself runs in a container but not in the shipped
          # image, so it opts in explicitly; local runs outside the image
          # skip the marked tests instead of failing on the environment.
          PRINT_HANDY_IN_CONTAINER: '1'
          # The build step above installs the extension; require it so the
          # native bounds corpus cannot silently skip in this job.
          PRINT_HANDY_BOUNDS_REQUIRE_NATIVE: '1'
          COVERAGE_CORE: ${{ matrix.python-version == '3.12' && 'sysmon' || 'ctrace' }}
        run: python -m pytest -q -rs tests ${{ matrix.python-version == '3.12' && '--cov=print_handy --cov-report=xml:coverage.xml' || '' }}
      - name: Install Codecov upload dependencies (3.12 legs only)
        # The Codecov action checks for curl and gpg before it runs, and the
        # slim container image ships neither; that pre-flight failure is not
        # covered by the action's fail_ci_if_error, so the tools are installed
        # explicitly, like git, ffmpeg and jq above.
        if: matrix.python-version == '3.12'
        run: |
          command -v curl && command -v gpg || { apt-get update -q && apt-get install -y -q curl gnupg; }
          curl --version | head -n 1
          gpg --version | head -n 1
      - name: Upload coverage to Codecov (report-only)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: coverage.xml
          flags: offline-tests
          fail_ci_if_error: false
      - name: Coverage floors for the guard modules (reporting only, 3.12 legs only)
        # Deep-dive expansion (P3): scripts/coverage_floors.py checks this
        # shard's coverage.xml against per-module line floors for the
        # start-guard and refusal-path modules only. The floors were
        # measured from a focused guard-test run and set below it; each
        # shard splits the suite, so a shard's rates can sit below the
        # full-suite rates the floors were measured against. The step is
        # therefore reporting-only (continue-on-error) until the floors
        # are confirmed against a merged full-suite report; a red step
        # here is the signal to do that confirmation, not a merge block.
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python3 scripts/coverage_floors.py coverage.xml

  offline-tests-result:
    # Keeps the required check names "offline-tests (3.12)" and "offline-tests (3.14)": passes only when
    # every offline shard passed.
    if: always()
    needs: offline-tests
    name: offline-tests (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: All offline shards passed
        run: test "${{ needs.offline-tests.result }}" = success

  bounds-image-stage:
    # Builds the Dockerfile's bounds-build stage on PRs (#952 phase 2): no
    # other PR check builds the image, so the pinned rustup-init checksum,
    # the toolchain and the maturin wheel build were first exercised at
    # publish time, and arm64 never before a release. Each architecture
    # builds on its own native runner (no emulation), then the wheel is
    # checked to carry the extension at the path the runtime stage
    # extracts, and that extraction is run exactly as the Dockerfile does.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the bounds-build stage
        run: docker build --target bounds-build -t bounds-build:ci .
      - name: The wheel carries the extension where the runtime stage extracts it
        run: |
          set -euo pipefail
          id=$(docker create bounds-build:ci)
          mkdir -p "$RUNNER_TEMP/out" && docker cp "$id:/out/." "$RUNNER_TEMP/out/" && docker rm "$id"
          cd "$RUNNER_TEMP/out"
          ls *.whl
          python3 -m zipfile -l *.whl
          python3 -m zipfile -e *.whl x
          so=$(ls x/print_handy/core/_bounds_native*.so)
          test -s "$so"
          echo "extension: $so"

  runtime-image-build:
    # Builds the FULL runtime image on PRs (follow-up to the
    # bounds-image-stage job above): that job exercises the bounds-build
    # stage and the wheel layout, but the runtime stage itself was only
    # ever built at publish time, so two consecutive develop publishes
    # (runs 42395068953 and 42410316669) each discovered a runtime-stage
    # defect — first the maturin invocation (#1015), then the missing
    # site-packages print_handy/core/ directory in the bounds copy step.
    # Default build args keep the optional Orca and Bambu stages inert;
    # every other stage, the runtime stage included, builds exactly as
    # the published image builds it. Each architecture builds on its own
    # native runner (no emulation), and the placed extension is
    # import-checked at both install locations.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the full image
        run: docker build -t print-handy-runtime:ci .
      - name: The native bounds extension imports at both install locations
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 print-handy-runtime:ci \
            -c "from print_handy.core import _bounds_native as m; print('working copy imports, API_VERSION', m.API_VERSION)"
          docker run --rm --workdir / --entrypoint python3 print-handy-runtime:ci \
            -c "import print_handy.core._bounds_native as m; print('site-packages copy imports, API_VERSION', m.API_VERSION)"

  native-bounds:
    # Builds the Rust/PyO3 bounds extension (#952, D1) and runs the
    # equivalence corpus against the native path. The wheel's extension
    # is mirrored into the source package (as the Dockerfile does for
    # /app) so the tests import it instead of the source tree shadowing
    # site-packages; PRINT_HANDY_BOUNDS_REQUIRE_NATIVE then makes a
    # missing extension a hard failure in the strict dispatcher test,
    # so this job cannot pass by silently falling back or skipping.
    # The -rs summary prints any remaining skips for the record.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: python -m pip install ".[test]" "maturin==1.16.0"
      - name: Stage the package skeleton beside the crate
        # maturin places the extension at the module path only when the
        # target package's directories exist beside the crate (mixed
        # layout); without this the wheel ships a top-level package.
        run: |
          mkdir -p native/bounds/print_handy/core
          cp print_handy/__init__.py native/bounds/print_handy/__init__.py
          cp print_handy/core/__init__.py native/bounds/print_handy/core/__init__.py
      - name: Build the native bounds wheel
        working-directory: native/bounds
        run: maturin build --release --locked
      - name: Install the native bounds wheel
        run: python -m pip install native/bounds/target/wheels/*.whl
      - name: Mirror the extension into the source package
        run: |
          PURELIB="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          cp "$PURELIB"/print_handy/core/_bounds_native*.so print_handy/core/
      - name: Run the bounds corpus against the native path
        env:
          PRINT_HANDY_BOUNDS_REQUIRE_NATIVE: "1"
        run: python -m pytest tests/pipeline/test_native_bounds.py -q -rs

  discord-timing:
    # A required status check on main (the owner added it; #1196). Keep the job name.
    # Fake Discord flow timing on both transports, mock slicer, 3 repeats; medians must stay within
    # tests/corpus/timing_baseline.json (+10% + max(0.35 s, 10% of the baseline), #734). Raising a baseline needs
    # a fresh "reason", and the total drift from the first recording is limited (tests/corpus/timing_gate.py).
    # The baseline is re-recorded from this job's artifact on every release (tests/README.md, Slicing-speed gate).
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Time the corpus (3 repeats, both transports)
        run: |
          mkdir -p timing
          for i in 1 2 3; do python -m tests.corpus.time_corpus --transport both --json timing/run-$i.json; done
      - name: Timing gate against the reviewed baseline
        run: >-
          python -m tests.corpus.timing_gate timing/run-1.json timing/run-2.json timing/run-3.json
          --summary "$GITHUB_STEP_SUMMARY" --title "Discord flow timing (mock slicer, required)"
      - name: Proposed baseline from this runner (for review, never applied automatically)
        if: always()
        run: >-
          python -m tests.corpus.timing_gate timing/run-*.json --record
          --recorded-from "CI run ${{ github.run_id }} (${{ github.sha }}), artifact discord-timing, median of 3"
          > timing/proposed-baseline.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: discord-timing
          path: timing/

  slicer-timing-real:
    name: Slicer timing (real Orca, reporting only)
    # #734 real-slicer leg: a small fixed set of corpus cases goes end to end through the fake Discord
    # flow with the pinned Orca (same install as Slicer test (stable)), 3 repeats, medians compared to
    # tests/corpus/timing_baseline_real_slicer.json. REPORTING ONLY while its runner noise is measured:
    # problems are warning annotations, the gate step exits 0, and the job is continue-on-error. It is
    # not a required status check; promote it (drop --warn-only and continue-on-error) only after a few
    # releases of data, as tests/README.md (Slicing-speed gate) describes. Cases are the ones that slice in seconds;
    # must-shrink (minutes, a 347 MB G-code) is deliberately left out. stl-large-plate (#952, decision D4)
    # is the deliberate exception to "slice in seconds": a generated solid cube whose slice is a 50 MB class
    # G-code, added reporting-only so the large-plate passes #952 measured get timed and its variance can
    # be measured before anyone proposes promoting it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      ORCA_FLATPAK_APP_ID: com.orcaslicer.OrcaSlicer
      PRINT_HANDY_REAL_SLICER: "1"
      # Same pin tests/conftest.py applies to the real-slicer corpus tests these cases come from.
      PRINT_HANDY__LAYOUT__SPACING: medium
      TIMING_CASES: >-
        --case single-part --case stl-single-part --case plates-multicolor
        --case witch-ghost-cults3d --case rotation-fit --case stl-large-plate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache the pinned OrcaSlicer bundle and runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/orcaslicer-v${{ env.ORCA_BUNDLE_VERSION }}.flatpak
            ~/.local/share/flatpak
          key: orcaslicer-flatpak-v${{ env.ORCA_BUNDLE_VERSION }}-${{ env.ORCA_RUNTIME_COMMIT }}-${{ runner.os }}-x86_64
      - name: Install the pinned OrcaSlicer bundle and GNOME runtime
        run: sh scripts/install-orca-flatpak.sh
      - name: Warm-up slice (not timed; first flatpak start pays one-off costs)
        run: xvfb-run -a python -m tests.corpus.time_corpus --real-slicer --transport direct --case single-part || true
      - name: Time the real-slicer cases (3 repeats, direct transport)
        run: |
          mkdir -p slicer-timing
          # shellcheck disable=SC2086 # TIMING_CASES is a list of --case arguments
          for i in 1 2 3; do
            # A failed flow is reported by the comparison below; it must not stop the remaining repeats.
            xvfb-run -a python -m tests.corpus.time_corpus --real-slicer --transport direct $TIMING_CASES \
              --json "slicer-timing/run-$i.json" \
              || echo "::warning title=Timing (reporting only)::repeat $i had a failed or errored flow"
          done
      - name: Time one Discord standalone-transport case (3 repeats, reporting only)
        # Deep-dive expansion (#734 follow-up): the leg's timed cases all run the hermes
        # transport, so the standalone Discord bot flow — the other Discord surface a user
        # waits on — was never timed against the real slicer. single-part is timed on the
        # standalone transport and recorded like the hermes runs, but it is NOT part of the
        # baseline comparison below: it has no recorded baseline yet, and the comparison
        # treats a baselineless case as a problem. Its proposed baseline is written with the
        # hermes one so a reviewed baseline can be added once a few runs of data exist —
        # the same staging the hermes leg went through before its baseline was recorded.
        run: |
          for i in 1 2 3; do
            xvfb-run -a python -m tests.corpus.time_corpus --real-slicer --transport standalone --case single-part \
              --json "slicer-timing/standalone-run-$i.json" \
              || echo "::warning title=Timing (reporting only)::standalone repeat $i had a failed or errored flow"
          done
      - name: Compare with the real-slicer baseline (warnings only)
        run: >-
          python -m tests.corpus.timing_gate slicer-timing/run-1.json slicer-timing/run-2.json slicer-timing/run-3.json
          --baseline tests/corpus/timing_baseline_real_slicer.json --warn-only --absolute-slack
          --summary "$GITHUB_STEP_SUMMARY" --title "Slicer timing (real Orca, reporting only)"
      - name: Proposed baseline from this runner (for review, never applied automatically)
        if: always()
        run: >-
          python -m tests.corpus.timing_gate slicer-timing/run-*.json
          --baseline tests/corpus/timing_baseline_real_slicer.json --record
          --recorded-from "CI run ${{ github.run_id }} (${{ github.sha }}), artifact slicer-timing-real, median of 3"
          > slicer-timing/proposed-baseline.json || true
      - name: Proposed standalone baseline from this runner (for review, never applied automatically)
        if: always()
        # Guarded on at least one standalone timing file existing: with no
        # matches the glob stays literal, timing_gate would fail reading it
        # (hidden by || true) and the redirection would still create a
        # 0-byte proposed-baseline-standalone.json for the artifact step to
        # upload. With no data, say so and write nothing (#1060).
        run: |
          files=(slicer-timing/standalone-run-*.json)
          if [ -f "${files[0]}" ]; then
            python -m tests.corpus.timing_gate "${files[@]}" \
              --baseline tests/corpus/timing_baseline_real_slicer.json --record \
              --recorded-from "CI run ${{ github.run_id }} (${{ github.sha }}), artifact slicer-timing-real, median of 3, standalone transport" \
              > slicer-timing/proposed-baseline-standalone.json || true
          else
            echo "No standalone timing data from this runner: no slicer-timing/standalone-run-*.json files, so no proposed standalone baseline was written."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: slicer-timing-real
          path: slicer-timing/

  dependency-audit:
    # Known-vulnerability check of the dependencies declared in pyproject.toml,
    # audited as installed (runtime plus the test extra). It does not upgrade anything.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: pip-audit
        run: python -m pip_audit

  standalone-no-hermes:
    # #73: the standalone bot installs from the runtime dependencies alone (pip install .), loads every handler and imports no Hermes module.
    # The setup checks run against the installed wheel (#1196): from a directory outside the checkout, with
    # `python -I` (no cwd or PYTHONPATH on sys.path), after a guard step proves print_handy comes from the venv.
    # A file missing from print_handy/ in the wheel therefore fails them. The root-level config/ and plugins/
    # are not in the wheel (a source checkout or the image provides them), so the known-gap step reports that
    # separately and the checks below lay those two folders beside the installed package, as a source install has them.
    runs-on: ubuntu-24.04  # Debian 13 container; hosted runner supplies the VM only.
    container:
      image: python:3.12-slim-trixie
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Clean venv with runtime dependencies only
        run: |
          python -m venv "/tmp/clean"
          "/tmp/clean/bin/python" -m pip install .
      # KNOWN GAP, deliberately non-blocking. The checks below run `python -m print_handy.bot check` with
      # the checkout as the working directory, so Python imports the checkout's print_handy, not the
      # wheel installed above: they prove the runtime dependencies and the standalone code path, not the
      # package a user gets from pip. This step runs from outside the checkout and so tests the installed
      # wheel. It fails today because the wheel ships only print_handy/: config/home.toml (settings.ROOT
      # is the parent of the package) and plugins/print-feedback (the command handlers, bot/router.py)
      # are not packaged. Fix the packaging, then delete continue-on-error so this step blocks.
      - name: Installed wheel check from outside the checkout (known gap, not blocking)
        id: wheel-check
        continue-on-error: true
        env:
          PRINT_HANDY__BOT__MODE: standalone
          PRINT_HANDY__DISCORD__CHAT_ID: "100000000000000001"
          PRINT_HANDY__DISCORD__ALLOWED_USER_IDS: "200000000000000002"
          DISCORD_BOT_TOKEN: not-a-real-token
          PRINT_HANDY__PATHS__HERMES_HOME: /tmp/print-handy-wheel
        run: |
          mkdir -p /tmp/outside && cd /tmp/outside
          "/tmp/clean/bin/python" -I -c "import print_handy, sys; print(print_handy.__file__); sys.exit(0 if '/tmp/clean/' in print_handy.__file__ else 1)"
          "/tmp/clean/bin/python" -I -m print_handy.bot check
      - name: Say plainly that the wheel check failed
        if: steps.wheel-check.outcome == 'failure'
        run: >-
          echo "::warning title=standalone-no-hermes::The installed wheel cannot run the bot check by itself
          (it lacks config/ and plugins/print-feedback at the package root). The checks below run the installed
          package with those two folders laid beside it. Known gap, not a full pass."
      - name: Lay config and plugins beside the installed wheel
        run: |
          mkdir -p /tmp/outside && cd /tmp/outside
          root="$("/tmp/clean/bin/python" -I -c "import pathlib, print_handy; print(pathlib.Path(print_handy.__file__).resolve().parent.parent)")"
          case "$root" in /tmp/clean/*) ;; *) echo "print_handy is not the installed wheel: $root"; exit 1 ;; esac
          cp -r "$GITHUB_WORKSPACE/config" "$root/config"
          mkdir -p "$root/plugins" && cp -r "$GITHUB_WORKSPACE/plugins/print-feedback" "$root/plugins/print-feedback"
          "/tmp/clean/bin/python" -I -c "import print_handy, sys; assert print_handy.__file__.startswith('/tmp/clean/'), print_handy.__file__; assert not any(p.startswith('$GITHUB_WORKSPACE') for p in sys.path), sys.path"
      - name: Standalone bot setup check
        env:
          PRINT_HANDY__BOT__MODE: standalone
          PRINT_HANDY__DISCORD__CHAT_ID: "100000000000000001"
          PRINT_HANDY__DISCORD__ALLOWED_USER_IDS: "200000000000000002"
          DISCORD_BOT_TOKEN: not-a-real-token
        run: |
          export PRINT_HANDY__PATHS__HERMES_HOME="/tmp/print-handy"
          cd /tmp/outside
          "/tmp/clean/bin/python" -I -m print_handy.bot check
      # #164 stages 2-3: Telegram and Matrix are standalone platforms too, and
      # stdlib-only by design. The same clean venv must pass `bot check` on
      # each, so a stray non-runtime import in their paths fails here instead
      # of on a real standalone install.
      - name: Standalone bot setup check (Telegram)
        env:
          PRINT_HANDY__BOT__MODE: standalone
          PRINT_HANDY__BOT__PLATFORM: telegram
          PRINT_HANDY__TELEGRAM__CHAT_ID: "-1001234567890"
          PRINT_HANDY__TELEGRAM__ALLOWED_USER_IDS: "424242"
          TELEGRAM_BOT_TOKEN: not-a-real-token
        run: |
          export PRINT_HANDY__PATHS__HERMES_HOME="/tmp/print-handy"
          cd /tmp/outside
          "/tmp/clean/bin/python" -I -m print_handy.bot check
      - name: Standalone bot setup check (Matrix)
        env:
          PRINT_HANDY__BOT__MODE: standalone
          PRINT_HANDY__BOT__PLATFORM: matrix
          PRINT_HANDY__MATRIX__HOMESERVER_URL: "https://matrix.example.org"
          PRINT_HANDY__MATRIX__ROOM_ID: "!prints:example.org"
          PRINT_HANDY__MATRIX__ALLOWED_USER_IDS: "@user:example.org"
          MATRIX_ACCESS_TOKEN: not-a-real-token
        run: |
          export PRINT_HANDY__PATHS__HERMES_HOME="/tmp/print-handy"
          cd /tmp/outside
          "/tmp/clean/bin/python" -I -m print_handy.bot check

  slicer-test-stable:
    name: Slicer test (stable, shard ${{ matrix.shard }})
    # Three corpus shards run in parallel (tests/conftest.py, PRINT_HANDY_TEST_SHARD); the
    # slicer-test-stable-result job reports the "Slicer test (stable)" check branch protection requires.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # The production track: the stable build docker/orca-prebuilt.sh pins is the shipped slicer (#356), so the full
    # corpus and the slicer fixtures run against its upstream flatpak bundle. That bundle ships
    # packed vendor profiles only (BBL.opc), so this job is also the packed-tree proof:
    # template generation here goes through print_handy's preset-cache reader.
    # Flatpak plus xvfb requires a full system session and display; kept on the host runner after
    # Debian 13 container attempts failed during actual slicer startup.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORCA_FLATPAK_APP_ID: com.orcaslicer.OrcaSlicer
      PRINT_HANDY_REAL_SLICER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache the pinned OrcaSlicer bundle and runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/orcaslicer-v${{ env.ORCA_BUNDLE_VERSION }}.flatpak
            ~/.local/share/flatpak
          key: orcaslicer-flatpak-v${{ env.ORCA_BUNDLE_VERSION }}-${{ env.ORCA_RUNTIME_COMMIT }}-${{ runner.os }}-x86_64
      - name: Install the pinned OrcaSlicer bundle and GNOME runtime
        run: sh scripts/install-orca-flatpak.sh
      - name: Slicer tests and Discord flow corpus with real Orca
        env:
          PRINT_HANDY_TEST_SHARD: ${{ matrix.shard }}/3
        run: xvfb-run -a python -m pytest -v -s tests/slicer tests/corpus tests/pipeline/test_first_layer_workflow.py

  slicer-test-stable-result:
    if: always()
    needs: slicer-test-stable
    name: Slicer test (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All stable slicer shards passed
        run: test "${{ needs.slicer-test-stable.result }}" = success

  slicer-test-bambu:
    name: Slicer test (bambu)
    # Bambu Studio is the Bambu Lab vendor default slicer and the one-shot fallback when
    # Orca execution fails, but it stays out of the published image (the image
    # workflows keep the source-build stage off) and was covered only with the slicer
    # process mocked. This leg
    # runs the A1 production path (primary + fallback) against the real Flathub Bambu
    # Studio the home configuration uses. Templates still come from the pinned OrcaSlicer
    # bundle, exactly like production: profiles.install is identity-checked against the
    # OrcaSlicer tree, and Bambu Studio slices from the resolved profiles.
    # Flatpak plus xvfb requires a full system session and display; kept on the host
    # runner, same as the Orca legs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORCA_FLATPAK_APP_ID: com.orcaslicer.OrcaSlicer
      BAMBU_FLATPAK_APP_ID: com.bambulab.BambuStudio
      # Flathub ostree commit of com.bambulab.BambuStudio v2.8.2.61 (recorded from
      # `flatpak info --show-commit`); the install step deploys exactly this commit.
      BAMBU_FLATPAK_COMMIT: "68a634d4d733ce7acf79009095db6f7ca76625f0eb810eef1e92dc7adeba7852"
      PRINT_HANDY_REAL_SLICER: "1"
      PRINT_HANDY_REAL_BAMBU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Install flatpak and xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak xvfb
      - name: Cache slicer bundles and flatpak installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/orcaslicer-v${{ env.ORCA_BUNDLE_VERSION }}.flatpak
            ~/.local/share/flatpak
          key: slicer-test-bambu-flatpak-${{ env.BAMBU_FLATPAK_COMMIT }}-v${{ env.ORCA_BUNDLE_VERSION }}-${{ env.ORCA_RUNTIME_COMMIT }}-${{ runner.os }}-x86_64
      - name: Install the pinned OrcaSlicer bundle and GNOME runtime
        run: sh scripts/install-orca-flatpak.sh
      - name: Install Bambu Studio from Flathub at the pinned commit
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          if ! flatpak info --user --show-ref "$BAMBU_FLATPAK_APP_ID" >/dev/null 2>&1; then
            flatpak install --user -y --noninteractive flathub "$BAMBU_FLATPAK_APP_ID"
          fi
          # Deploy exactly the pinned commit (a no-op when the install already is the
          # pin, a downgrade when Flathub has moved on), then prove what is deployed.
          flatpak update --user -y --noninteractive --commit="$BAMBU_FLATPAK_COMMIT" "$BAMBU_FLATPAK_APP_ID"
          deployed="$(flatpak info --user --show-commit "$BAMBU_FLATPAK_APP_ID")"
          echo "Bambu Studio deployed commit: $deployed (pinned: $BAMBU_FLATPAK_COMMIT)"
          test "$deployed" = "$BAMBU_FLATPAK_COMMIT"
          flatpak info --user "$BAMBU_FLATPAK_APP_ID" | grep -E 'Version|Ref'
      - name: Run slicer tests against Bambu Studio
        run: xvfb-run -a python -m pytest -v -s tests/slicer/test_bambu_real_a1.py

  spoolman:
    # spool_sync against a real, throwaway Spoolman.
    runs-on: ubuntu-24.04  # Debian 13 container; hosted runner supplies the VM only.
    container:
      image: python:3.12-slim-trixie
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python -m pip install ".[test]"
      - name: Install Debian tools and pinned Spoolman server
        run: |
          set -euo pipefail
          apt-get update -q
          apt-get install -y -q curl unzip
          archive="$RUNNER_TEMP/spoolman.zip"
          curl -fL --retry 3 https://github.com/Donkie/Spoolman/releases/download/v0.27.1/spoolman.zip -o "$archive"
          echo '77ba10fa505a42cef606eabec1a7c9a5b93c51dc40067456a29a7d9480ef27d6  '"$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/spoolman-src"
          unzip -q "$archive" -d "$RUNNER_TEMP/spoolman-src"
          cd "$RUNNER_TEMP/spoolman-src"
          python -m venv "$RUNNER_TEMP/spoolman-venv"
          "$RUNNER_TEMP/spoolman-venv/bin/python" -m pip install uvicorn~=0.34
          "$RUNNER_TEMP/spoolman-venv/bin/python" -m pip install -r requirements.txt
          echo "SPOOLMAN_APP_DIR=$PWD" >> "$GITHUB_ENV"
          echo "SPOOLMAN_PYTHON=$RUNNER_TEMP/spoolman-venv/bin/python" >> "$GITHUB_ENV"
      - name: Start isolated Spoolman server
        run: |
          mkdir -p "$RUNNER_TEMP/spoolman-data"
          cd "$SPOOLMAN_APP_DIR"
          PATH="$RUNNER_TEMP/spoolman-venv/bin:$PATH" SPOOLMAN_DIR_DATA="$RUNNER_TEMP/spoolman-data" SPOOLMAN_PORT=7912 SPOOLMAN_HOST=127.0.0.1 \
            "$SPOOLMAN_PYTHON" -m uvicorn spoolman.main:app --host 127.0.0.1 --port 7912 \
            > "$RUNNER_TEMP/spoolman.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/spoolman.pid"
      - name: Wait for Spoolman
        run: |
          for i in $(seq 60); do
            if curl -fsS -o /dev/null http://localhost:7912/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/spoolman.log"
          echo "Spoolman did not come up"; exit 1
      - name: Spoolman tests
        env:
          PRINT_HANDY_SPOOLMAN_TEST_URL: http://localhost:7912
        run: python -m pytest -v -rs tests/services

  state-volume-mount:
    name: State volume (real bind mount)
    # The one state-volume test that exercises the entrypoint against a
    # REAL bind mount (tests/test_state_volume.py, the unstubbed mountpoint
    # detector) needs user+mount namespaces. Inside the offline job's
    # container, unshare -rm is refused, so the test skipped there with
    # "user and mount namespaces are not available". This job runs the
    # single test on the runner VM itself (no job container), where
    # unprivileged namespaces work, and proves it before running: if the
    # probe cannot create namespaces even after lifting Ubuntu 24.04's
    # AppArmor restriction, the job fails loudly instead of the test
    # silently skipping again (2026-11-07 test-suite cleanup, round 2).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Prove user and mount namespaces work on this runner
        run: |
          if ! unshare -rm true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rm true
      - name: Real bind-mounted state volume test
        env:
          # The suite is container-marked (#971); this job provides the
          # environment the marked test needs, so it opts in explicitly,
          # exactly like the offline-tests job does.
          PRINT_HANDY_IN_CONTAINER: '1'
        run: python -m pytest -v -rs "tests/test_state_volume.py::TestEntrypointMigration::test_legacy_data_and_a_real_bind_mounted_state_volume_is_copied"

  webui-browser-smoke:
    # #1052 shipped browser tests but never executed them. This separate gate
    # runs Chromium against the actual loopback server and fails on skipped
    # tests, instead of accepting five dormant skips as a green job.
    name: Web UI browser smoke (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]" "playwright==1.56.0"
      - name: Install the headless Chromium browser
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser tests and record machine-readable results
        env:
          PRINT_HANDY_BROWSER_SMOKE: '1'
        run: python -m pytest -q -rs tests/test_webui_browser_smoke.py --junitxml=browser-smoke.xml
      - name: Refuse missing or skipped browser tests
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse("browser-smoke.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          failed = sum(int(s.attrib.get("failures", 0)) + int(s.attrib.get("errors", 0)) for s in suites)
          assert tests >= 5 and not skipped and not failed, (
              f"Browser gate refused: tests={tests}, skipped={skipped}, failed={failed}")
          print(f"All {tests} real-browser tests executed with no skips.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: webui-browser-smoke
          path: browser-smoke.xml

  spelling:
    # US-spelling watch for prose (catduck, 2026-10-29): scans only the lines
    # a change adds to Markdown files, plus the PR description, for the
    # British color/honor family and the -ise verbs (see
    # scripts/check_us_spelling.py for the word list and the allow marker).
    # Existing British spellings elsewhere stay untouched, and this job is
    # intentionally NOT a required status check.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Save the PR description for the spelling scan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/pr-body.txt', context.payload.pull_request.body || '');
      - name: Check added prose for British spellings
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          args=(--base "$base")
          if [ -f "$RUNNER_TEMP/pr-body.txt" ]; then args+=(--body-file "$RUNNER_TEMP/pr-body.txt"); fi
          python scripts/check_us_spelling.py "${args[@]}"
