name: Docker image validation (manual)

# INERT until a maintainer dispatches it: no push, pull_request or schedule trigger. It builds the
# image for ONE architecture on the matching native hosted runner and runs
# tests/docker/image_acceptance.sh against it offline.
# It never pushes or publishes an image, tags, releases or deploys, and never contacts Discord, a
# printer or an external Spoolman server (the included Spoolman runs only inside the
# harness's isolated network). The image and the build cache are discarded with the runner.
# Run only under the approval packet in docs/DOCKER-117-ACCEPTANCE.md ("Phase 3 hosted run").
on:
  workflow_dispatch:
    inputs:
      app_channel:
        description: Application channel label
        type: choice
        options: [development, stable]
        default: development
      ort_flavor:
        description: ONNX Runtime flavor for the local failure detector (#455); openvino is amd64-only
        type: choice
        options: [cpu, openvino, cuda]
        default: cpu
      architecture:
        description: Target architecture (built on the matching native runner, never emulated)
        type: choice
        options: [amd64, arm64]
        default: amd64
      previous_image:
        description: Release the lifecycle gate upgrades from and downgrades to (tag or digest)
        type: string
        default: ghcr.io/catduckgnaf/print-handy:latest

permissions:
  contents: read

concurrency:
  group: docker-image-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Pinned runner labels: ubuntu-latest moves to 26 on 2026-10-19. arm64 uses
    # the native ARM runner; no QEMU emulation is used.
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 330   # below the 6 h hosted-job limit; the build is bounded inside it
    env:
      IMAGE: print-handy-validation:${{ github.run_id }}-${{ github.run_attempt }}
      # Inputs reach the shell only as environment variables, never interpolated into scripts.
      APP_CHANNEL: ${{ inputs.app_channel }}
      ORT_FLAVOR: ${{ inputs.ort_flavor }}
      ARCHITECTURE: ${{ inputs.architecture }}
      PLATFORM: ${{ inputs.architecture == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
      # One image is published (#353): the full image, WITH_ORCA=true and
      # WITH_GO2RTC=true; Bambu Studio stays out of the published image.
      WITH_ORCA: "true"
      WITH_GO2RTC: "true"
      WITH_BAMBU: "false"
      # Spoolman is included in the stack (#214); acceptance always exercises it.
      SPOOLMAN_MODE: included
      PREVIOUS_IMAGE: ${{ inputs.previous_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the lifecycle gate reads the previous release's
          # .env.example from its tag (tests/docker/lifecycle_gate.sh).
          fetch-depth: 0
      - name: Record the exact source and Orca prebuilt pins
        id: pins
        run: |
          set -euo pipefail
          # Orca is prebuilt-only: docker/orca-prebuilt.sh is the single pin source for the
          # one bundled build. The source revision is one pin; the SHA256 and asset
          # name are per architecture (2 each).
          [ "$(grep -cE 'revision=[0-9a-f]{40}' docker/orca-prebuilt.sh)" = 1 ] || { echo "expected one pinned Orca revision"; exit 1; }
          [ "$(grep -cE 'sha256_(amd64|arm64)=[0-9a-f]{64}' docker/orca-prebuilt.sh)" = 2 ] || { echo "expected two pinned Orca SHA256 digests (one build x two architectures)"; exit 1; }
          [ "$(grep -cE 'asset_(amd64|arm64)=' docker/orca-prebuilt.sh)" = 2 ] || { echo "expected two pinned Orca assets (one build x two architectures)"; exit 1; }
          mkdir -p evidence
          { echo "source_sha=$GITHUB_SHA"; grep -E 'version=|revision=|sha256_|asset_' docker/orca-prebuilt.sh
            echo "app_channel=$APP_CHANNEL architecture=$ARCHITECTURE platform=$PLATFORM with_orca=$WITH_ORCA with_go2rtc=$WITH_GO2RTC with_bambu=$WITH_BAMBU spoolman=$SPOOLMAN_MODE ort_flavor=$ORT_FLAVOR"
          } | tee evidence/pins.txt
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tee evidence/disk.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker  # build straight into the runner's image store; nothing is pushed
      - name: Build (no push)
        run: |
          set -euo pipefail
          start=$(date -u +%FT%TZ)
          docker buildx build --platform "$PLATFORM" --progress=plain --load -t "$IMAGE" \
            --build-arg "APP_CHANNEL=$APP_CHANNEL" \
            --build-arg "ORT_FLAVOR=$ORT_FLAVOR" \
            --build-arg "WITH_ORCA=$WITH_ORCA" \
            --build-arg "WITH_GO2RTC=$WITH_GO2RTC" \
            --build-arg "WITH_BAMBU=$WITH_BAMBU" \
            . 2>&1 | tee evidence/build.log
          { echo "build_start=$start"; echo "build_end=$(date -u +%FT%TZ)"
            echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")"
            docker image inspect --format 'platform={{.Os}}/{{.Architecture}} size={{.Size}}' "$IMAGE"
            docker run --rm --entrypoint sh "$IMAGE" -c 'cat /orca-stable-build-info 2>/dev/null || echo orca-stable=absent; cat /bambu-build-info 2>/dev/null || echo bambu=absent'
          } | tee evidence/identity.txt
      - name: Assert the OCI license and source labels (#1158)
        run: |
          set -euo pipefail
          # The Dockerfile carries the static labels; a build that loses
          # them ships an image that no longer names its license or its
          # source, which is the defect #1158 tracks. The revision and
          # version labels are stamped by the publish workflows (they
          # need the release ref), so they are not asserted here.
          labels="$(docker image inspect --format '{{json .Config.Labels}}' "$IMAGE")"
          echo "$labels"
          grep -q '"org.opencontainers.image.licenses":"AGPL-3.0-only"' <<<"$labels" || {
            echo "built image is missing the org.opencontainers.image.licenses label" >&2
            exit 1
          }
          grep -q '"org.opencontainers.image.source":"https://github.com/catduckgnaf/print-handy"' <<<"$labels" || {
            echo "built image is missing the org.opencontainers.image.source label" >&2
            exit 1
          }
      - name: Headless slice with the bundled Orca
        run: |
          set -euo pipefail
          for channel in stable; do
            docker run --rm --network none --cpus 2 --memory 4g --pids-limit 256 \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --tmpfs /data:uid=1000,gid=1000,size=512m \
              -e "PRINT_HANDY_ORCA_CHANNEL=$channel" \
              "$IMAGE" python3 /app/docker/slicer-smoke.py \
              2>&1 | tee "evidence/slicer-$channel.log"
          done
      - name: Offline runtime acceptance
        run: tests/docker/image_acceptance.sh "$IMAGE" "$SPOOLMAN_MODE" evidence/acceptance
      - name: Release lifecycle gate (fresh install, upgrade, restore, downgrade)
        run: |
          set -euo pipefail
          # The previous release is pulled read-only (anonymous, public); nothing is pushed.
          docker pull --platform "$PLATFORM" "$PREVIOUS_IMAGE"
          tests/docker/lifecycle_gate.sh "$PREVIOUS_IMAGE" "$IMAGE" evidence/lifecycle
      - name: Keep the evidence (logs and identities only, never the image)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docker-image-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
