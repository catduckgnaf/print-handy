name: cross-slicer-extended

# Extended cross-slicer matrix for issue #1525: genuine producer
# fixtures are (re)generated with the real producer applications and
# uploaded as artifacts with their provenance manifest. This workflow is
# scheduled and manual only — never a required check — because genuine
# producer production is heavy and, for Cura, headless project saving is
# not a supported CLI operation: the Cura step records the attempt and
# its outcome in the job summary instead of pretending success.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-fixtures:
    name: Genuine producer fixtures (extended)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libwebkit2gtk-4.1-0 libsoup-3.0-0
      - name: Download the pinned PrusaSlicer AppImage
        env:
          PRUSA_URL: https://github.com/prusa3d/PrusaSlicer/releases/download/version_2.8.1/PrusaSlicer-2.8.1+linux-x64-newer-distros-GTK3-202409181416.AppImage
          PRUSA_SHA256: 565f2f4bd4dbb05904a459d54db1916b6932124709c1d17b5aacfe9f5f2f1b03
        run: |
          curl -L -o prusa.AppImage "$PRUSA_URL"
          echo "$PRUSA_SHA256  prusa.AppImage" | sha256sum -c -
          chmod +x prusa.AppImage
          ./prusa.AppImage --appimage-extract > /dev/null
          echo "PRUSA_BIN=$PWD/squashfs-root/usr/bin/prusa-slicer" >> "$GITHUB_ENV"
      - name: Generate genuine PrusaSlicer fixture and rebuild spec-synthetic fixtures
        run: |
          xvfb-run -a python3 scripts/generate_producer_fixtures.py --prusa "$PRUSA_BIN"
          cat tests/corpus/producer-fixtures/PROVENANCE.json
      - name: Attempt genuine Cura production (recorded, never faked)
        continue-on-error: true
        env:
          CURA_URL: https://github.com/Ultimaker/Cura/releases/download/5.8.1/UltiMaker-Cura-5.8.1-linux-X64.AppImage
          CURA_SHA256: 54b77e574d0b851658a6565b2a4129e035eca80840f562d0845f77dd0019457d
        run: |
          curl -L -o cura.AppImage "$CURA_URL"
          echo "$CURA_SHA256  cura.AppImage" | sha256sum -c -
          chmod +x cura.AppImage
          ./cura.AppImage --appimage-extract > /dev/null
          # Cura has no supported headless "save project" CLI operation.
          # The attempt runs the real binary's version probe and records
          # the outcome; a genuine Cura fixture is added only if a real
          # project file comes out of a real Cura run.
          xvfb-run -a ./squashfs-root/AppRun --version || true
          echo "Cura genuine project production remains an open gap unless a .3mf was produced above." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload producer fixtures and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: producer-fixtures
          path: tests/corpus/producer-fixtures/
