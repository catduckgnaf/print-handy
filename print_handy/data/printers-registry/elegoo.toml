# Printer registry: elegoo. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "elegoo." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/elegoo/ so this file cannot silently drift from the code.

[[printer]]
key = "elegoo.neptune4"
label = "Elegoo Neptune 4"
vendor = "elegoo"
firmware = "Klipper"
firmware_family = "klipper"
connection = "moonraker"
kinematics = "Cartesian"
bed_mm = [230.0, 230.0]
max_height_mm = 265.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/elegoo/neptune4.py"
notes = "Stock Klipper + Moonraker. Marketed bed is 235 x 235 mm; the pinned Orca profile's printable area is 230 x 230 mm and is what is recorded."
[printer.thermal]
enclosure = "open"
enclosure_provenance = "vendor documentation"
door_lid_state_knowable = "unknown"
chamber_heater_present = "absent"
chamber_heater_control = "not_supported"
chamber_heater_evidence = ""
chamber_provenance = "vendor documentation"
chamber_sensor_present = "unknown"
chamber_sensor_fresh_reading = "unknown"
fan_part_cooling_present = "present"
fan_part_cooling_mapping = "M106"
fan_auxiliary_present = "present"
fan_auxiliary_mapping = "unknown"
fan_exhaust_present = "unknown"
fan_exhaust_mapping = "unknown"
fan_filtration_present = "unknown"
fan_filtration_mapping = "unknown"
fan_provenance = "vendor documentation"

