# Printer registry: prusa. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "prusa." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/prusa/ so this file cannot silently drift from the code.

[[printer]]
key = "prusa.mk4s"
label = "Prusa MK4S"
vendor = "prusa"
firmware = "Prusa Buddy (PrusaLink)"
firmware_family = "prusa"
connection = "prusalink"
kinematics = "Cartesian (moving bed)"
bed_mm = [250.0, 210.0]
max_height_mm = 220.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/prusa/mk4s.py"
notes = "PrusaLink LAN (status, verified upload, gated start) when configured; otherwise slicing/checks/Discord delivery only. Not tested on hardware."
[printer.thermal]
enclosure = "open"
enclosure_provenance = "vendor documentation"
door_lid_state_knowable = "unknown"
chamber_heater_present = "absent"
chamber_heater_control = "not_supported"
chamber_heater_evidence = ""
chamber_provenance = "vendor documentation"
chamber_sensor_present = "unknown"
chamber_sensor_fresh_reading = "unknown"
fan_part_cooling_present = "present"
fan_part_cooling_mapping = "M106 P0"
fan_auxiliary_present = "unknown"
fan_auxiliary_mapping = "unknown"
fan_exhaust_present = "unknown"
fan_exhaust_mapping = "unknown"
fan_filtration_present = "unknown"
fan_filtration_mapping = "unknown"
fan_provenance = "vendor documentation"

