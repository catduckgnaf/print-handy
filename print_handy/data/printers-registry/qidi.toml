# Printer registry: qidi. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "qidi." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/qidi/ so this file cannot silently drift from the code.

[[printer]]
key = "qidi.q1pro"
label = "Qidi Q1 Pro"
vendor = "qidi"
firmware = "Klipper"
firmware_family = "klipper"
connection = "moonraker"
kinematics = "CoreXY"
bed_mm = [245.0, 245.0]
max_height_mm = 240.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/qidi/q1pro.py"
notes = "Stock Klipper + Moonraker. Enclosed CoreXY with an actively heated chamber (set by the template start code, not driven separately). The pinned Orca profile records a bed exclusion polygon along the back edge; not tested on hardware."
[printer.thermal]
enclosure = "enclosed"
enclosure_provenance = "vendor documentation"
door_lid_state_knowable = "unknown"
chamber_heater_present = "present"
chamber_heater_control = "supported"
chamber_heater_evidence = "PRINT_START CHAMBER= argument in the Qidi template start code (docs/QIDI.md)"
chamber_provenance = "verified profile"
chamber_sensor_present = "present"
chamber_sensor_fresh_reading = "unknown"
fan_part_cooling_present = "present"
fan_part_cooling_mapping = "M106"
fan_auxiliary_present = "present"
fan_auxiliary_mapping = "M106 P2"
fan_exhaust_present = "present"
fan_exhaust_mapping = "unknown"
fan_filtration_present = "unknown"
fan_filtration_mapping = "unknown"
fan_provenance = "verified profile"

