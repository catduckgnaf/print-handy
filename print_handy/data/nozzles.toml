# Tuned slicing profile parameters per nozzle diameter (mm)
# Used by orca_adapter to generate per-size machine and process configuration overrides.
# Type-specific thermal and flow defaults are validated by nozzle.py; temperature
# offsets can be overridden in config/home.yaml or a local config file under nozzle_temp_offsets.
[types.brass]
max_temperature_c = 300.0
temp_offset_c = 0.0
flow_multiplier = 1.0

[types.stainless_steel]
max_temperature_c = 300.0
# Lower thermal conductivity than brass (#513): +5 C by default so the melt
# zone matches the brass baseline for EVERY filament material — the offset
# composes on top of whatever filament baseline (PLA, PETG, ABS, composites,
# ...) is resolved, it is not tied to any one material. Override per type in
# [nozzle_temp_offsets] (-10..+15 C).
temp_offset_c = 5.0
flow_multiplier = 0.95

[types.hardened_steel]
max_temperature_c = 450.0
# Same low-conductivity compensation as stainless steel (#513): +5 C default
# (the documented +5..+10 C band; 5 is the conservative end and operators can
# raise it to 10 in [nozzle_temp_offsets]).
temp_offset_c = 5.0
flow_multiplier = 0.95

[types.ruby]
max_temperature_c = 500.0
temp_offset_c = 0.0
flow_multiplier = 1.0

[types.tungsten_carbide]
max_temperature_c = 500.0
temp_offset_c = 0.0
flow_multiplier = 1.05

[types.diamond]
max_temperature_c = 500.0
temp_offset_c = 0.0
flow_multiplier = 1.05

