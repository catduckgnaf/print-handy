[[entry]]
id = "marlin.heating-failed"
name = "Heating failed / Thermal Runaway"
aliases = ["heating failed", "thermal runaway", "thermal protection", "err extruder heater"]
firmware = "marlin"
kind = "error"
printers = ["octoprint.marlin", "octoprint.ender3", "octoprint.ender3pro", "octoprint.ender3v2", "octoprint.ender3v3se", "octoprint.i3megas", "octoprint.vyper", "octoprint.chiron", "octoprint.maxpro2", "octoprint.kobra", "octoprint.kobraneo", "octoprint.kobraplus", "octoprint.kobramax", "sovol_marlin.sv01", "sovol_marlin.sv01_pro", "sovol_marlin.sv02", "sovol_marlin.sv03", "sovol_marlin.sv04", "sovol_marlin.sv05", "sovol_marlin.sv06_plus", "sovol_marlin.sv06"]
command = ""
description = "Marlin stopped heating because a temperature did not move as expected, or moved when it should not. Common causes: a loose or failed thermistor, a heater cartridge fault, a silicone sock or fan cooling the block, or a target the heater cannot reach. The printer needs a power cycle after the fault is fixed."
safety = "This is a fire-safety protection doing its job. Do not disable thermal protection to clear it. Power off, let everything cool, and inspect the thermistor and heater wiring before heating again."
notes = "Source: Marlin firmware documentation (marlinfw.org G-code reference). Generic Marlin knowledge; the scope names every registered Marlin preset (issue #647) because each runs this same firmware \u2014 the entry was previously scoped to the generic octoprint.marlin preset only."
[[entry]]
id = "marlin.mintemp-maxtemp"
name = "MINTEMP / MAXTEMP triggered"
aliases = ["mintemp", "maxtemp", "mintemp triggered", "maxtemp triggered", "err mintemp", "err maxtemp", "thermistor error"]
firmware = "marlin"
kind = "error"
printers = ["octoprint.marlin", "octoprint.ender3", "octoprint.ender3pro", "octoprint.ender3v2", "octoprint.ender3v3se", "octoprint.i3megas", "octoprint.vyper", "octoprint.chiron", "octoprint.maxpro2", "octoprint.kobra", "octoprint.kobraneo", "octoprint.kobraplus", "octoprint.kobramax", "sovol_marlin.sv01", "sovol_marlin.sv01_pro", "sovol_marlin.sv02", "sovol_marlin.sv03", "sovol_marlin.sv04", "sovol_marlin.sv05", "sovol_marlin.sv06_plus", "sovol_marlin.sv06"]
command = ""
description = "Marlin halted because a temperature reading left the plausible range: MINTEMP triggered means a heater read below the minimum (usually a disconnected or broken thermistor circuit, which reads as extreme cold), MAXTEMP triggered means it read above the maximum (usually a shorted thermistor or its wires touching). The message names the heater at fault. Unlike a heating-failed halt, this one is about the sensor's reading itself, not about heat failing to arrive; the printer stops and needs a reset once the sensor fault is fixed."
safety = "Power off and inspect the named heater's thermistor and wiring before resetting. A shorted thermistor can also mask a real overheat, so do not clear the error and reheat on trust."
notes = "Source: Marlin firmware's own temperature error strings ('MINTEMP triggered' / 'MAXTEMP triggered', raised by the temperature module's error path); OctoPrint's virtual-printer documentation reproduces the same two strings for its simulated Marlin. Facts only; the description is written for Print Handy. Generic Marlin knowledge, not verified on a Print Handy printer."
