# Two generated source plates whose parts fit one bed: the planner merges them
# onto a single plate and slices once.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "two small source plates that fit together are merged onto one bed"

[[click]]
question = "Choose colors for these parts"
button = "One color for everything"

[[click]]
question = "Choose the color for Quantity A"
button = "White"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["Quantity A", "Quantity B"]
source_plates = 2
plate_mode = "merge"
gcodes = 1
supports = false
slots = 1

[model]
layout = "plates"

[[model.part]]
name = "Quantity A"
extruder = 1
size = [35, 30, 8]
at = [35, 40]

[[model.part]]
name = "Quantity B"
extruder = 1
size = [35, 30, 8]
at = [95, 40]

[[model.plate]]
name = "Plate A"
parts = [0]

[[model.plate]]
name = "Plate B"
parts = [1]
