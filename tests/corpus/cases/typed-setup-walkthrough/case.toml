# The typed-message path (#1142): the operator types the guided setup command and
# answers its first questions by typing, then cancels. No file is dropped; the case
# times the typed round-trips through the dispatch hooks / bot core.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "typed /print-handy setup conversation: start, answer the first steps, cancel"

[entry]
kind = "typed"
texts = ["/print-handy setup", "discord", "/print-handy cancel"]

[expect]
starts = 0
sends_contain = ["Guided setup started", "Setup step 2 of", "Setup paused"]

# Carried for the generator inventory like every case folder; the typed runner never drops it.
[model]
layout = "plates"

[[model.part]]
name = "Cube"
extruder = 1
size = [30, 30, 20]
at = [90, 90]

[[model.plate]]
name = "Plate 1"
parts = [0]
