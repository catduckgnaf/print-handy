# PrusaSlicer MMU project: Metadata/Slic3r_PE.config palette plus
# slic3rpe:mmu_segmentation paint (#714, #717). The palette must reach the
# region questions; the regions print in the colors picked for them.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "PrusaSlicer MMU palette feeds the painted-region questions"

[[click]]
question = "Keep distinct source regions or explicitly"
button = "Keep distinct source regions"

[[click]]
question = "for Red regions"
button = "White"

[[click]]
question = "for Blue regions"
button = "Black"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["Banner"]
prompts = ["Red regions (#E74C3C", "Blue regions (#2980B9"]
gcodes = 1
supports = false
# The painted half used to reach the G-code on the base slot only; since
# Phase C of the #1110 program the slic3rpe:mmu_segmentation states are
# decoded and remapped like paint_color, so each region prints in the slot
# picked for it.

[model]
format = "prusa-mmu-3mf"
colors = ["#E74C3C", "#2980B9"]

[[model.part]]
name = "Banner"
size = [40, 20, 10]
at = [60, 60]
