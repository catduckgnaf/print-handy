# A generated 260 x 260 x 230 mm binary STL on a 220 mm bed (CC0): too big in every orientation.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
fixture = "model.stl"
description = "binary STL fit detection and operator-selected shrink before slicing"

[[click]]
question = "Choose the color for"
button = "White"

[[click]]
question = "does not fit"
button = "Shrink to"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
source_kind = ".stl"
source_size_mm = [260, 260, 230]
gcodes = 1
scale_range = [0.78, 0.84]
prompts = ["does not fit", "Choose the color for"]
supports = false
slots = 1

[model]
format = "stl"

[[model.part]]
name = "Part"
size = [260, 260, 230]
