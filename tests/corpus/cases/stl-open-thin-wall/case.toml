# Thin-walled generated open box: one side panel is removed from a closed shell.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "thin wall geometry is audited as open and non-manifold"

[[click]]
question = "Choose the color for"
button = "White"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print without supports"

[expect]
# Orca reports floating regions here; the operator answered "Slice and print without supports" before bed-clear.
prompts = ["floating region"]
status = "STARTED"
source_kind = ".stl"
source_size_mm = [30.0, 30.0, 1.0]
gcodes = 1
supports = false
slots = 1
mesh_manifold = false

[model]
format = "stl"

[[model.part]]
name = "Part"
size = [30, 30, 1.0]
drop_faces = 2

[mock_slicer]
# What real Orca reports for this model with supports off (CI stable tier, PR #904); the mock
# slicer writes it to result.json so both tiers ask the same support question.
warnings = ["It seems object stl-open-thin-wall.stl has a floating cantilever. Please re-orient the object or enable support generation."]
