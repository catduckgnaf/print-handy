# The print-now path (#1142): the same two-plate split job as split-plan for the setup,
# then the operator types /print-next for the second plate. Only the typed segment is
# timed (the setup drop flow is not part of this case's measurement).
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "two plates via the split plan; plate 1 starts in the setup flow, then a typed /print-next starts plate 2"

[entry]
kind = "print-next"

[[click]]
question = "Choose colors for these parts"
button = "One color for everything"

[[click]]
question = "Choose the color for"
button = "White"

[[click]]
question = "does not fit"
button = "split"

[[click]]
question = "Which plate prints first"
button = "Plate 1"

[[click]]
question = "·"
button = "Slice and print"

[[click]]
question = "Next plate for"
button = "Start next plate"

[expect]
status = "STARTED"
segment_starts = 1
segment_prompts = ["Next plate for"]

[model]
layout = "plates"

[[model.part]]
name = "Left half"
extruder = 1
size = [150, 150, 10]
at = [0, 0]

[[model.part]]
name = "Right half"
extruder = 1
size = [150, 150, 10]
at = [160, 0]

[[model.plate]]
name = "Plate 1"
parts = [0, 1]
