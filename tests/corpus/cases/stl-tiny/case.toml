# Tiny but valid generated cuboid, intentionally only 1.5 mm on each axis.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "very small printable item receives a unit confirmation (#206), an explicit color choice and receipt"

[[click]]
question = "do not record units"
button = "Millimeters"

[[click]]
question = "Choose the color for"
button = "White"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
source_kind = ".stl"
