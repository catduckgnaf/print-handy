# Generated T-bracket binary STL: overhanging bar and no project metadata (CC0).
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "STL overhang: Orca warns, the support question asks, and re-slicing with supports carries tree supports into the G-code"

[[click]]
question = "Choose the color for"
button = "White"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print with supports"

[expect]
status = "STARTED"
source_kind = ".stl"
source_size_mm = [60, 30, 40]
gcodes = 1
scale = 1.0
# The operator chose "Slice and print with supports" on the pre-slice summary.
supports = true
prompts = ["floating region"]
slots = 1

[model]
format = "stl"

[[model.part]]
name = "Part"
shape = "t"
size = [60, 12, 40, 6, 30]

[mock_slicer]
# What real Orca reports for this model with supports off (CI stable tier, PR #904); the mock
# slicer writes it to result.json so both tiers ask the same support question.
warnings = ["It seems object stl-needs-supports.stl has a floating cantilever. Please re-orient the object or enable support generation."]
