# Plain core 3MF: per-object basematerials colors, one assembly, no slicer metadata.
# The 2026-10-31 Witch Ghost shape (#711): every answer used to be rejected.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "core basematerials author colors become per-part questions and the answers validate"

[[click]]
question = "Choose colors for these parts"
button = "Choose colors"

[[click]]
question = "body"
button = "White"

[[click]]
question = "hat"
button = "Black"

[[click]]
question = "band"
button = "Pink"

[[click]]
question = "gold"
button = "Dark green"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["body", "hat", "band", "gold"]
prompts = ["author made it White", "author made it Black", "author made it Pink", "author made it Green"]
colors = { body = "white", hat = "black", band = "pink", gold = "dark green" }
gcodes = 1
supports = false
slots = 4
