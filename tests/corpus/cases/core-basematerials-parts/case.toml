# Plain core 3MF: per-object basematerials colors, one assembly, no slicer metadata.
# The 2026-10-31 Witch Ghost shape (#711): every answer used to be rejected.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "core basematerials author colors become per-part questions and the answers validate"

[[click]]
question = "Use these colors?"
button = "Change colors"

[[click]]
question = "pick the rest?"
button = "Pick every color"

[[click]]
question = "Same colors as last time"
button = "Change colors"

[[click]]
question = "Choose colors for these parts"
button = "Choose colors"

[[click]]
question = "author made it White"
button = "White"

[[click]]
question = "Choose the color/material for Part 1 (source: body)"
button = "White"

[[click]]
question = "author made it Black"
button = "Black"

[[click]]
question = "Choose the color/material for Part 2 (source: hat)"
button = "Black"

[[click]]
question = "author made it Pink"
button = "Pink"

[[click]]
question = "Choose the color/material for Part 3 (source: band)"
button = "Pink"

[[click]]
question = "Choose the color/material for Part 4 (source: gold)"
button = "Dark green"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["body", "hat", "band", "gold"]
prompts = ["Choose the color/material for Part 1 (source: body)", "Choose the color/material for Part 2 (source: hat)", "Choose the color/material for Part 3 (source: band)", "Choose the color/material for Part 4 (source: gold)"]
colors = { body = "white", hat = "black", band = "pink", gold = "dark green" }
gcodes = 1
supports = false
slots = 4

[model]
format = "core-3mf"

[[model.part]]
name = "body"
size = [30, 30, 20]
at = [40, 60]
color = "#FAF9F7"

[[model.part]]
name = "hat"
size = [20, 20, 15]
at = [80, 60]
color = "#383845"

[[model.part]]
name = "band"
size = [20, 6, 4]
at = [120, 60]
color = "#FFB3C4"

[[model.part]]
name = "gold"
shape = "cylinder"
size = [5, 4]
at = [40, 110]
color = "#067749"
