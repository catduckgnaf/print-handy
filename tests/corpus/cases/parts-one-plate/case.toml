# Post is assigned to both source plates. Production tolerates the overlap:
# the part is counted once and both plates' parts merge onto a single bed.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "a part assigned to two plates is tolerated and merged once"

[[click]]
question = "Choose colors for these parts"
button = "Choose colors"

[[click]]
question = "Choose the color/material for"
button = "White"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["Base", "Post", "Tab"]
source_plates = 2
colors = { "Base" = "white", "Post" = "white", "Tab" = "white" }
plate_mode = "merge"
gcodes = 1
supports = false
slots = 1

[model]
layout = "plates"

[[model.part]]
name = "Base"
extruder = 1
size = [70, 50, 6]
at = [60, 60]

[[model.part]]
name = "Post"
extruder = 1
shape = "cylinder"
size = [10, 30]
at = [70, 130]

[[model.part]]
name = "Tab"
extruder = 1
size = [30, 12, 4]
at = [130, 140]

[[model.plate]]
name = "Plate 1"
parts = [0, 1]

[[model.plate]]
name = "Plate 2"
parts = [1, 2]
