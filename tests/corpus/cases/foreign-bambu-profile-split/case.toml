# The route (c) twin of foreign-bambu-profile (#868): a Bambu X1C project too wide for one bed is split, so each
# half slices as a derived plate, a byte copy of the source package that Orca reads directly with its embedded
# X1C profile (speeds, acceleration, start G-code, Supertack bed). Generated by tests/corpus/make_models.py.
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "a foreign Bambu profile on split plates is replaced by the AD5X profile before Orca reads the plate"

[[click]]
question = "Choose colors for these parts"
button = "One color for everything"

[[click]]
question = "Choose the color for"
button = "White"

[[click]]
question = "does not fit"
button = "split"

[[click]]
question = "Which plate prints first"
button = "Plate 1"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["Left half", "Right half"]
source_plates = 1
colors = { "Left half" = "white", "Right half" = "white" }
prompts = ["does not fit", "Which plate prints first"]
plate_mode = "split"
gcodes = 2
scale = 1.0
supports = false
slots = 1
# What Orca read from each derived plate: the job's AD5X profile, not the X1C one the project embeds.
orca_input = { printer_model = "Flashforge AD5X", curr_bed_type = "Cool Plate", inherits = "" }
orca_input_from_job = ["outer_wall_speed", "default_acceleration", "machine_start_gcode", "printer_settings_id", "enable_prime_tower"]
orca_input_absent = ["default_jerk"]
# Real tier only: the values the real Orca reports in each G-code header.
gcode_settings = { printer_model = "Flashforge AD5X", curr_bed_type = "Cool Plate" }

[model]
layout = "plates"
project = { enable_prime_tower = "1", printer_model = "Bambu Lab X1 Carbon", printer_settings_id = "Bambu Lab X1 Carbon 0.4 nozzle", print_settings_id = "0.20mm Standard @BBL X1C", inherits = "0.20mm Standard @BBL X1C", different_settings_to_system = ["outer_wall_speed;default_acceleration", "", ""], machine_start_gcode = "M1002 judge_flag g29_before_print_flag\nG28\n", curr_bed_type = "Supertack Plate", outer_wall_speed = "300", default_acceleration = "10000", default_jerk = "9" }

[[model.part]]
name = "Left half"
extruder = 1
size = [150, 150, 10]
at = [0, 0]

[[model.part]]
name = "Right half"
extruder = 1
size = [150, 150, 10]
at = [160, 0]

[[model.plate]]
name = "Plate 1"
parts = [0, 1]
