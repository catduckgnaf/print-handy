# Two 150 mm halves side by side: each fits the 220 mm bed alone, both together do not.
# Generated by tests/corpus/make_models.py (CC0, no third party source).
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "too wide for one bed, but the parts fit one at a time: choose the 100% split plan and print plate 1"

[[click]]
question = "Choose colors for these parts"
button = "One color for everything"

[[click]]
question = "Choose the color for"
button = "White"

[[click]]
question = "does not fit"
button = "split"

[[click]]
question = "Which plate prints first"
button = "Plate 1"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["Left half", "Right half"]
source_plates = 1
colors = { "Left half" = "white", "Right half" = "white" }
prompts = ["does not fit", "Which plate prints first"]
# One G-code per half, at full size.
plate_mode = "split"
gcodes = 2
scale = 1.0
supports = false
slots = 1

[model]
layout = "plates"

[[model.part]]
name = "Left half"
extruder = 1
size = [150, 150, 10]
at = [0, 0]

[[model.part]]
name = "Right half"
extruder = 1
size = [150, 150, 10]
at = [160, 0]

[[model.plate]]
name = "Plate 1"
parts = [0, 1]
