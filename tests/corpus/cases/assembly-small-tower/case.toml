# A smaller prime tower on a smaller nozzle. Generated by tests/corpus/make_models.py (CC0, no third party source).
license = "CC0 1.0: generated by tests/corpus/make_models.py, no third party geometry"
description = "a 0.25 mm nozzle with a 35 mm tower merges a two color model that the 0.4 mm nozzle's 45 mm tower splits"

[[click]]
question = "Choose colors for these parts"
button = "Choose colors"

[[click]]
question = "for Base,"
button = "White"

[[click]]
question = "for Overlay,"
button = "Black"

[[click]]
question = "How many copies"
button = "One copy"

[[click]]
question = "·"
button = "Slice and print"

[expect]
status = "STARTED"
parts = ["Base", "Overlay"]
source_plates = 1
colors = { "Base" = "white", "Overlay" = "black" }
plate_mode = "merge"
gcodes = 1
slots = 2

# The 0.25 mm nozzle is the smallest the AD5X supports, and the planner only shrinks the tower below the
# shipped 45 mm when the configured width is lowered with it (color_geometry.effective_tower_mm). The model
# is sized "tight" for THIS printer, so it is larger than the default printer can merge.
[printer]
nozzle = 0.25
tower = 35

[model]
layout = "assembly"
fit = "tight"

[[model.part]]
name = "Base"
extruder = 1
height = 4
footprint = [1.0, 1.0]

[[model.part]]
name = "Overlay"
extruder = 2
height = 2
footprint = [0.9, 0.9]
