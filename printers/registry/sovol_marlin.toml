# Printer registry: sovol_marlin. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "sovol_marlin." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/sovol_marlin/ so this file cannot silently drift from the code.

[[printer]]
key = "sovol_marlin.sv01"
label = "Sovol SV01 (Marlin/OctoPrint)"
vendor = "sovol_marlin"
firmware = "Marlin"
firmware_family = "marlin"
connection = "octoprint"
kinematics = "Cartesian (moving bed)"
bed_mm = [280, 240]
max_height_mm = 300
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/sovol_marlin/sv01.py"
notes = "Offline catalog entry. OrcaSlicer Sovol SV01 0.4 nozzle printable area. Generic templates, not a tuned vendor profile, and not checked on hardware."
[printer.thermal]
