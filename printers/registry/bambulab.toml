# Printer registry: bambulab. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "bambulab." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/bambulab/ so this file cannot silently drift from the code.

[[printer]]
key = "bambulab.a1"
label = "Bambu Lab A1"
vendor = "bambulab"
firmware = "Bambu Lab (offline handoff only)"
firmware_family = "none"
connection = "bambulab_lan"
kinematics = "Cartesian (moving bed)"
bed_mm = [256.0, 256.0]
max_height_mm = 256.0
filament_slots = 4
color_system = "multi_slot"
profile = "print_handy/printers/bambulab/a1.py"
notes = "Slicing, fit checks and G-code validation, plus opt-in read-only LAN status when configured. AMS Lite is not driven."
[printer.thermal]
enclosure = "open"
enclosure_provenance = "vendor documentation"
door_lid_state_knowable = "unknown"
chamber_heater_present = "absent"
chamber_heater_control = "not_supported"
chamber_heater_evidence = ""
