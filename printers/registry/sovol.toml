# Printer registry: sovol. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "sovol." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/sovol/ so this file cannot silently drift from the code.

[[printer]]
key = "sovol.sv06"
