vendor = "sovol"
firmware = "Klipper"
firmware_family = "klipper"
connection = "moonraker"
kinematics = "Cartesian (moving bed)"
bed_mm = [220.0, 220.0]
max_height_mm = 250.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/sovol/sv06.py"
