# Printer registry: octoprint. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "octoprint." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/octoprint/ so this file cannot silently drift from the code.

[[printer]]
key = "octoprint.marlin"
label = "Marlin via OctoPrint"
vendor = "octoprint"
firmware = "Marlin"
firmware_family = "marlin"
connection = "octoprint"
kinematics = "unspecified"
bed_mm = [220.0, 220.0]
max_height_mm = 220.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/octoprint/marlin.py"
notes = "Marlin support goes through OctoPrint's serial connection and REST API, not direct USB/serial. Dimensions are placeholders to override in local config."
[printer.thermal]
enclosure = "unknown"
enclosure_provenance = "unknown"
door_lid_state_knowable = "unknown"
chamber_heater_present = "unknown"
chamber_heater_control = "unknown"
chamber_heater_evidence = ""
chamber_provenance = "unknown"
chamber_sensor_present = "unknown"
chamber_sensor_fresh_reading = "unknown"
fan_part_cooling_present = "unknown"
fan_part_cooling_mapping = "unknown"
fan_auxiliary_present = "unknown"
fan_auxiliary_mapping = "unknown"
fan_exhaust_present = "unknown"
fan_exhaust_mapping = "unknown"
fan_filtration_present = "unknown"
fan_filtration_mapping = "unknown"
fan_provenance = "unknown"

