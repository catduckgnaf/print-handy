# Printer registry: elegoo_sdcp. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "elegoo_sdcp." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/elegoo_sdcp/ so this file cannot silently drift from the code.

[[printer]]
key = "elegoo_sdcp.centauricarbon"
label = "Elegoo Centauri Carbon"
vendor = "elegoo_sdcp"
firmware = "Elegoo SDCP"
firmware_family = "none"
connection = "elegoo_sdcp"
kinematics = "CoreXY"
bed_mm = [256.0, 256.0]
max_height_mm = 256.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/elegoo_sdcp/centauricarbon.py"
notes = "Closed firmware; SDCP v3.0 LAN protocol (unauthenticated). Marketed bed is 260 x 260 mm; the pinned Orca profile's printable area is 256 x 256 mm and is what is recorded."
[printer.thermal]
enclosure = "enclosed"
enclosure_provenance = "vendor documentation"
door_lid_state_knowable = "unknown"
chamber_heater_present = "unknown"
chamber_heater_control = "unknown"
chamber_heater_evidence = ""
chamber_provenance = "unknown"
chamber_sensor_present = "unknown"
chamber_sensor_fresh_reading = "unknown"
fan_part_cooling_present = "unknown"
fan_part_cooling_mapping = "unknown"
fan_auxiliary_present = "unknown"
fan_auxiliary_mapping = "unknown"
fan_exhaust_present = "unknown"
fan_exhaust_mapping = "unknown"
fan_filtration_present = "unknown"
fan_filtration_mapping = "unknown"
fan_provenance = "unknown"

