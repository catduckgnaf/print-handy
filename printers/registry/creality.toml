# Printer registry: creality. See printers/README.md for the schema.
#
# One [[printer]] per registered model whose key starts with "creality." — the
# loader (print_handy/knowledge/registry.py) merges every file in this directory
# in sorted filename order, and tests pin each entry against the code profile in
# print_handy/printers/creality/ so this file cannot silently drift from the code.

[[printer]]
key = "creality.ender3v3"
label = "Creality Ender-3 V3"
vendor = "creality"
firmware = "Klipper"
firmware_family = "klipper"
connection = "moonraker"
kinematics = "Cartesian (moving bed)"
bed_mm = [220.0, 220.0]
max_height_mm = 250.0
filament_slots = 1
color_system = "single"
profile = "print_handy/printers/creality/ender3v3.py"
notes = "Creality OS (Klipper-based) + Moonraker. Open-frame bed-slinger; not tested on hardware. Marlin Enders are not this vendor — they use octoprint.marlin."
[printer.thermal]
enclosure = "open"
enclosure_provenance = "vendor documentation"
door_lid_state_knowable = "unknown"
chamber_heater_present = "absent"
chamber_heater_control = "not_supported"
chamber_heater_evidence = ""
chamber_provenance = "vendor documentation"
chamber_sensor_present = "unknown"
chamber_sensor_fresh_reading = "unknown"
fan_part_cooling_present = "present"
fan_part_cooling_mapping = "unknown"
fan_auxiliary_present = "present"
fan_auxiliary_mapping = "unknown"
fan_exhaust_present = "unknown"
fan_exhaust_mapping = "unknown"
fan_filtration_present = "unknown"
fan_filtration_mapping = "unknown"
fan_provenance = "verified profile"

